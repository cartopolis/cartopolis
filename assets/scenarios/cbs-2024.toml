# Figures about Dutch places, buurt to country (docs/mockups/scenarios/, v5-areas).
#
# CBS's Kerncijfers wijken en buurten 2024, as `atlas areas cbs-2024` writes
# them: CBS publishes buurt, wijk and gemeente; province and country are rolled
# up from the gemeenten (a count summed, a share weighted). Each layer stands on
# all five rungs, and the one read follows the camera. A figure CBS keeps back
# (too few people to publish) is left uncoloured, never guessed.
#
# Bands are for reading, not ranking: a few even steps around the national
# figure, one ColorBrewer sequential ramp per layer (light to dark, distinct
# enough to tell apart over the map at 70 % cover).

[scenario]
name = "Kerncijfers wijken en buurten 2024"
mode = "replay"
confidence = "documented"
summary = "Who lives where: CBS's key figures per buurt, wijk and gemeente."
sources = [
  "CBS, Kerncijfers wijken en buurten 2024, via PDOK (CC BY 4.0)",
  "Provinces and the country: Kadaster, Bestuurlijke gebieden, via PDOK",
  "Province and country figures: rolled up from the gemeenten by Cartopolis",
]
clock = { start = "2024", end = "2024" }

[[region_state]]
id = "share_65_plus"
label = "Aged 65 and over"
boards = ["areas:cbs-buurt-2024", "areas:cbs-wijk-2024", "areas:cbs-gemeente-2024", "areas:cbs-provincie-2024", "areas:cbs-land-2024"]
derive = "value"
field = "share_65_plus"
state = [
  { id = "a", label = "under 10 %", colour = "#ffffcc", below = 10.0 },
  { id = "b", label = "10 – 15 %", colour = "#c7e9b4", below = 15.0 },
  { id = "c", label = "15 – 20 %", colour = "#7fcdbb", below = 20.0 },
  { id = "d", label = "20 – 25 %", colour = "#41b6c4", below = 25.0 },
  { id = "e", label = "25 – 30 %", colour = "#2c7fb8", below = 30.0 },
  { id = "f", label = "30 % and over", colour = "#253494" },
]

