[workspace]
resolver = "2"
members = ["crates/vibe_core", "crates/vibe_sim", "crates/viberfox", "crates/big_space"]
default-members = ["crates/viberfox"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
approx = "0.5"
# Password hashing for server-side auth (ADR-016). `std` enables OsRng via
# password-hash/getrandom (salt + session-token generation).
argon2 = { version = "0.5", features = ["std"] }
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
# Slimmer than `default`: drops UI, 2D sprite stack, audio, gamepads, gizmos, picking — less LLVM work per build.
bevy = { version = "0.19", default-features = false, features = [
    # Auto-registers all `#[derive(Reflect)]` types (inventory-based). Required so
    # bevy_world_serialization can reflect-spawn glTF scenes (the avatar fox) —
    # without it, spawning panics on the first unregistered component type.
    "reflect_auto_register",
    "bevy_animation",
    # `bevy_animation` only enables the animation crate; the glTF *loader's*
    # clip parsing is behind bevy_gltf's own `bevy_animation` feature, wired via
    # this umbrella feature. Without it `GltfAssetLabel::Animation(n)` loads zero
    # `AnimationClip`s and every glТF (fox + Quaternius avatars) stays in rest pose.
    "gltf_animation",
    "async_executor",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_log",
    "bevy_pbr",
    # Bloom (moved out of bevy_core_pipeline in 0.19): the glare around the sun
    # disk and the sunlit limb from orbit — see `free_camera::setup_camera`.
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "jpeg",
    "multi_threaded",
    "png",
    "smaa_luts",
    "std",
    "tonemapping_luts",
    # NOTE: the Linux-only `wayland` windowing feature is added per-target in
    # crates/viberfox/Cargo.toml so macOS/Windows never resolve the wayland stack.
] }
# bevy_atmosphere removed in the 0.19 migration — replaced by Bevy's built-in
# bevy_pbr atmosphere (Atmosphere/AtmosphereSettings on the camera).
bevy_image = { version = "0.19", features = ["zstd_rust"] }
big_space = { path = "crates/big_space" }
bytes = "1.9"
egui = "0.35"
egui-wgpu = { version = "0.35", default-features = false }
clap = { version = "4.5", features = ["derive"] }
earcutr = "0.4"
figment = { version = "0.10", features = ["toml", "env"] }
fontdue = "0.9"
glam = { version = "0.32", features = ["serde"] }
image = "0.25"
# Float32 GeoTIFF decoding for the height layer (PDOK's AHN rasters). Pure Rust,
# already in the tree as `image`'s own TIFF backend, so this is a direct name for a
# dependency we were carrying anyway.
tiff = "0.10"
# Client-side vector-tile rendering (VersaTiles / Shortbread MVT → RGBA).
# Both are pure Rust with no C deps, so they survive the wasm32 target (ADR-033).
mvt-reader = "2.4"
tiny-skia = "0.12"
# The geometry types `mvt-reader` hands back; kept in lockstep with its own dep.
geo-types = "0.7"
postcard = { version = "1.1", features = ["alloc"] }
refinery = { version = "0.8", features = ["rusqlite-bundled"] }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.42", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "io-util",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.9", features = ["gzip"] }
dotenvy = "0.15"
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Default dev: fast dependency rebuilds; workspace crates at O1 (Bevy suggests O1+ for playable debug — see link in README).
# https://bevy.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
[profile.dev]
opt-level = 1
incremental = true
codegen-units = 256
debug = 1
# Faster incremental links on Linux: debug info in `.dwo` files instead of monolithic binary.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 0
codegen-units = 256

# Full Bevy book recipe: O3 on all dependencies — better dev *runtime*, much slower clean / dep rebuilds.
# https://bevy.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
[profile.dev-bevy]
inherits = "dev"

[profile.dev-bevy.package."*"]
opt-level = 3
codegen-units = 256
# No debuginfo for dependencies. Three reasons, one measurement each: their
# .dwo files (split-debuginfo=unpacked) embed the absolute target-dir path, so
# an sccache-shared artifact would point its debug info at another worktree's
# (possibly deleted) target; dep debuginfo is most of the profile's disk
# weight; and nobody steps through Bevy internals at opt-level=3 anyway —
# backtraces keep symbol names without it. Workspace crates keep full debug.
debug = false

[profile.dev-bevy.package.vibe_core]
opt-level = 0

# Shipped builds: trade compile time for runtime frame times (per the Bevy
# cheatbook's performance guidance). Fat LTO + a single codegen unit let the
# optimizer inline across crate boundaries (Bevy's hot ECS / render paths benefit
# most); abort-on-panic drops unwind tables and landing pads. `lto = true` (fat)
# is slow to link — drop to "thin" if the release compile becomes painful.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
debug = false
panic = "abort"

# The web build's working profile (ADR-033), and the reason it is not `dev-bevy`:
# that profile optimises *dependencies* and leaves this crate at opt-level 1, which
# is backwards for the browser. Bevy is hot, but so are our own streaming,
# tessellation and collision systems, and on wasm there is no fast native fallback
# to hide them. `debug = false` matters twice over here — debuginfo dominated a
# 135 MB module, and every byte is parsed and compiled by the browser on load.
#
# Thin LTO over 16 codegen units rather than the shipped profile's fat LTO over
# one: near-identical frame times for a fraction of the link, which is what makes
# this usable as a dev loop when a rebuild already has to re-do std.
# `debug = false` is not enough on its own: it drops DWARF, but the wasm `name`
# section is not DWARF and survives it. Measured on the module as built, that
# section was 43.4 MB of a 114.6 MB file — 38% of everything the browser
# downloads, parses and hands to its compiler, to hold nothing but the mangled
# names of 181k monomorphised functions. Stripping takes it to 71.3 MB (21.3 MB
# gzipped to 17.5 MB).
#
# The cost is that a browser stack trace becomes a list of indices. That is a
# real loss while the web build is still being debugged, so it is one env var to
# get back for a single build, without editing this file or invalidating anyone
# else's cache:
#
#     CARGO_PROFILE_WEB_RELEASE_STRIP=none ./crates/viberfox/serve-threads.sh
[profile.web-release]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = "symbols"
