# The cloud deck from noon to night — what `docs/notes/cloud-lighting.md`'s
# "Dutch light" section was judged on. Colour and lighting only mean anything
# on a real GPU (`midas take gpu`), and on the Deck set CARTO_DATA_DIR to an
# empty directory or the captures inherit the bot's settings.
#
#     CARTO_DATA_DIR=/tmp/empty cargo run -p cartopolis -- --shots docs/cloud-shots.toml
#
# Groningen, 40 m up, 50 % cover, 17 October: `west` looks toward the setting
# sun, `east` away from it. Sun elevation: 16 h 10°, 16.6 h 5°, 17 h 1.6°,
# 17.3 h −1°, 17.6 h −3.7°, 18 h −7°.
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "1280x720"
out_dir = "gpu/clouds"
hide_ui = true
mode = "free"
settle = 1.0
wait = 40.0

