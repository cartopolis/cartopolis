# The performance suite's scenarios.
#
#     cargo perf                       # every scenario → /tmp/perf.json
#     cargo perf --only orbit,city     # a subset
#     cargo perf --repeat 3 --only orbit  # three flights: median and range per column
#
#     # + the GPU passes and allocation columns. NOT `cargo perf --features perf`:
#     cargo run -p cartopolis --features perf -- --perf
#
# `cargo perf` is an alias for `cargo run -p cartopolis -- --perf`, so it takes the
# rest of the shot harness's flags too (`--size`, `--settle`, `--wait`) — but a
# cargo alias *appends*, and this one already ends in `--`, so anything meant for
# cargo itself lands on the binary instead. `--features perf` through the alias
# builds without the feature and then dies on "unexpected argument '--features'",
# which reads as the flag not existing rather than as being in the wrong place.
# This file and `.cargo/config.toml` both documented it that way and it cost a
# build to find out (2026-09-22).
#
# This is *not* `docs/shots.toml` with different numbers. That manifest picks views
# because they look good in a README; every entry here is picked because it costs
# differently from its neighbours, and a scenario measuring the same thing as the
# one above it should be deleted rather than kept for coverage.
#
# Three windows are measured per scenario:
#
#   load    teleport → settle verdict. The streaming burst — fetches, decodes, mesh
#           builds, uploads. What a teleport or a cold start costs.
#   steady  frames after the shutter, with the world *meant* to be settled. Check
#           `quiet` in the report before reading it as an idle number: at city
#           altitude the settle test passes while the vector tile streamer is still
#           trickling, and the harness warns when that happens.
#   turn    the same world while the camera yaws 2° a frame for 90 frames. What a
#           person turning the view pays over `steady`.
#
# Read `docs/notes/performance-suite.md` before adding a row, and before believing
# a timing column: this container rasterises on a CPU, so frame times and GPU
# milliseconds are host properties. Fragment-shader invocations, allocation counts,
# draw counts and residency are not.

# Pinned because a scripted run never sees the server handshake that supplies a
# tile source, and the built-in fallback is the *raster* basemap — on which `city`
# would measure a scene with no vector geometry at all.
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"

# Small on purpose. The suite measures per-frame *work* — allocations, draw calls,
# uploads, ECS time — almost none of which scales with resolution, while the CPU
# rasteriser's cost does. Raise it with `--size` when the question is about fill;
# note that fragment-shader invocations then scale with it, which is the check that
# the fill counter is working at all.
size = "640x360"

settle = 2.0
wait = 90.0
steady_frames = 60

[[scenario]]
name = "orbit"
description = """
The space tier with nothing streaming: per-pixel cost only, and the one scenario \
whose steady window reliably goes `quiet`. This is the control — a change that \
moves it moved the shaders or the sky, because there is no map geometry here to \
move — and it is the only scenario cheap enough for CI on a CPU rasteriser."""
mode = "earth"
at = [53.2194, 6.5665, 180000]
look = [-90.0, 0.0]
time = 12.0
clouds = 0.0
rain = 0.0
fog = 0.0

[[scenario]]
name = "low-orbit"
description = """
The globe filling the screen — the reported case of 84 fps with the planet small \
and 24 fps with it large, at ~120 draws and 8k triangles with nothing streaming. \
That cost survives an empty census, so it is per-pixel. Clouds are pinned ON: this \
scenario exists to hold that cost still, and `CARTO_NO_CLOUDS=1` is the A/B — \
against `fragment_invocations`, never against a timing."""
mode = "earth"
at = [53.2194, 6.5665, 1000000]
look = [-90.0, 0.0]
time = 12.0
clouds = 0.4
rain = 0.0
fog = 0.0

[[scenario]]
name = "city"
description = """
Groningen from 3 km, oblique — draw calls, 3DBAG cells, the clipmap and its \
occlusion culling. Also where residency is worst: ~950 MB on the desktop rung, of \
which geometry is the majority. Its steady window does **not** go quiet on this \
container, so read it as a streaming measurement and watch the `quiet` flag."""
at = [53.2194, 6.5665, 3000]
look = [-30.0, 35.0]
time = 12.0
fog = 0.1
clouds = 0.2
rain = 0.0
steady_frames = 30

[[scenario]]
name = "earth"
description = """
The view the app opens on: Earth mode, ~1.8 km out from a focus over Groningen at \
55° — the pose `free_camera::seed_start_view` lands on. Separate from `city` for \
its `turn` window, not its still one: a turn in Earth mode is a rotate-drag, which \
*swings the camera round the focus* on a circle about a kilometre across rather \
than turning it on the spot, so everything streamed around the camera's position \
retargets too. That is the gesture a person reported the frame rate collapsing \
under (2026-10-16), and `city`'s fly camera cannot reproduce it."""
mode = "earth"
at = [53.2194, 6.5665, 1500]
look = [-55.0, 0.0]
time = 12.0
fog = 0.1
clouds = 0.2
rain = 0.0
steady_frames = 30

[[scenario]]
name = "street"
description = """
Ground level in the centre of Groningen — every streamer at once, and the only \
scenario that measures what a person actually looks at. Surfaces, paving, \
buildings, interiors, street furniture and traffic all reach their finest ring \
here, and it is where the per-cell tessellation cost lands: 277 ms per ground \
surface cell on the handset rung, 45 % of all worker time in the fill.

Added 2026-09-22, when a host that can settle it became available. The three \
scenarios above are all teleports to altitude, and none of them exercises the \
ground streamers at their finest ring — which is why a fill dominated by waiting \
rather than by computing went unmeasured. Read `worker_utilisation` first here: \
it is the column that says whether the cores or the fetches are the wall, and on \
the handset rung it reads 0.13 against 8 threads.

Not expected to go `quiet` — like `city`, and more so. It is a streaming \
measurement, not an idle one."""
at = [53.2194, 6.5665, 120]
look = [-10.0, 35.0]
time = 12.0
fog = 0.1
clouds = 0.2
rain = 0.0
steady_frames = 30

[[scenario]]
name = "descent"
description = """
A live zoom from 40 km to street level over Groningen, in 8 s of wall clock — the \
scroll a person does, which a `--video-fps` movie hides by waiting for the world \
before every frame. Settles at 40 km, then drives the Earth-mode zoom target down \
the way a steadily turned wheel does and does not wait for anything. Its windows \
are `descent` (the zoom) and `arrive` (the camera there, the streamers catching \
up): read `quiet_after_s` and the `perf arrive layer` lines — what was missing on \
arrival and how long each layer took — and `ground_retears`, the ground ring \
thrown away mid-zoom. Pictures at arrival, +2 s, +5 s and quiet sit beside the \
report. Wall-clock by design, so its numbers are a property of the machine: run \
it on a real GPU and compare runs on the same node."""
mode = "earth"
at = [53.2194, 6.5665, 40000]
look = [-60.0, 0.0]
time = 12.0
fog = 0.1
clouds = 0.2
rain = 0.0
descend = { to = 150.0, seconds = 8.0 }

# Six scenarios, and the first five have all been run. A route view is still missing and an
# entry here is a claim that the viewpoint has been measured, so it stays out until
# somebody measures it.
#
# **On this container the ground-level entry is not runnable in practice** — a 3 km
# city view already takes minutes on a CPU rasteriser and `street` is strictly
# heavier. It is measured on `deck-1` (an AMD Van Gogh, one ssh hop through the
# VPS), which settles it in ~31 s. Anyone adding a ground-level scenario owes the
# same: a host that can settle it, and a reading taken there.
