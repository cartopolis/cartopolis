# The day/night cycle as a set of numbers: three views of Groningen's centre at
# ten times of 17 October, under one sky, for `sky::eye_adaptation_stops` and
# anything else that moves the exposure or the tone curve. Colour only means
# anything on a real GPU (a Mac node).
#
#     CARTO_DATA_DIR=/tmp/empty cargo run -p cartopolis -- --shots docs/daylight-shots.toml
#     CARTO_QUALITY=balanced CARTO_HANDSET=1 …   # the phone's rung
#
# Read the city apart from the sky. A whole frame's mean is mostly sky, and on
# 2026-11-07 it said the curve swap had left the day as bright as before while
# the buildings had gone a quarter stop darker. At 960×540 the crops are:
#   gm_*    city 960x300+0+240, sky 960x70+0+0
#   w_*/e_* city 960x150+0+390, sky 960x190+0+0
# e.g. `convert gm_12.png -crop 960x300+0+240 -colorspace Gray -format '%[fx:mean]' info:`.
# Compare a change against the same run on the commit before it, view by view:
# the three views disagree by more than a tuning step does.
#
# Sun elevation on the day (as `cloud-shots.toml`): 16 h 10°, 16.6 h 5°,
# 17.3 h −1°, 17.6 h −3.7°; 22 h is deep night.
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "960x540"
out_dir = "gpu/daylight"
hide_ui = true
mode = "free"
settle = 1.0
wait = 40.0

