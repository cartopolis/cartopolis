# Remembered camera positions: the documentation screenshots, and the subjects
# worth going back and looking at.
#
#     cargo shots                        # the documentation set → docs/img/<name>.png
#     cargo shots --only globe,route     # just these two
#     cargo shots --only tunnels         # a subject → docs/img/tunnels/<name>.png
#     cargo shots --only all             # everything
#
# `cargo shots` is an alias for
# `cargo run -p cartopolis -- --shots`, so it takes the rest of
# the harness's flags too (`--csv /tmp/shots.csv`, `--size 2560x1440`, …).
#
# To add or move a view: fly there in the app, then Dev panel ▸ View ▸ Shot
# presets ▸ "📋 Copy as preset" and paste the block it puts on the clipboard.
# That is the whole point of this file — a viewpoint that was found by hand once
# stays reproducible, instead of being re-flown and re-eyeballed every release.
#
# **A shot with no `group` is a documentation image**: `cargo shots` regenerates
# it and the README links the file. A shot *with* one is a subject — tunnels,
# bridges, doors — reached by `--only <group>`, written into its own directory,
# and left alone by a bare run. Type the group into the dev panel before copying
# and the block arrives with the line already in it. See the section below.

# Applies to every [[shot]] below unless it says otherwise.
#
# The tile source is pinned here because a scripted run never gets one from the
# server handshake, and the built-in fallback is the *raster* OSM basemap — on
# which the `route` shot has no graph to solve against (ADR-037). `CARTO_TILE_URL`
# still overrides this, so a local mirror needs no edit to this file.
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "1600x900"
out_dir = "img"
# Documentation images are chrome-free; the two that document the UI opt back in.
hide_ui = true
mode = "free"
# Cached tiles settle in about a second; give the detail patches longer than the
# interactive default so no image lands mid-stream. In practice the ground shots
# hit the `wait` cap rather than going quiet — the vector-tile streamer keeps
# trickling at city altitude — so `wait` is what actually sets how much of the
# city has arrived. Lower it for a quick iteration, raise it for a fuller frame.
settle = 1.5
wait = 45.0

[[shot]]
name = "city"
description = "Groningen city centre, oblique morning view over the 3DBAG roofs"
at = [53.2194, 6.5665, 420]
look = [-22.0, 35.0]
time = 9.5
fog = 0.10
clouds = 0.25

[[shot]]
name = "city-dusk"
description = "The same streets at sunset — the day/night curves and warm sun"
at = [53.2160, 6.5680, 550]
look = [-22.0, 285.0]
# 20:30 is already night here; sunset light lives around 18:00–19:00.
time = 18.6
fog = 0.18
clouds = 0.45

[[shot]]
name = "building"
description = "One building and what the public registers say about it: the BAG card and the glass highlight"
# `--ui building` selects the building nearest the avatar, so the avatar is the
# pointer here. Avatar mode: altitude is the follow distance (capped at 25 m by
# the harness), `look` the orbit elevation and azimuth around the avatar.
mode = "avatar"
at = [53.21905, 6.56880, 25]
look = [-30.0, 200.0]
time = 11.0
fog = 0.08
clouds = 0.2
hide_ui = false
ui = ["building"]

[[shot]]
name = "meet"
description = "Two people meeting in the street and talking — the shared world, with the chat bubbles"
# `--ui chat` seeds an exchange and stands a second speaker beside the avatar;
# every scripted run is offline, so this is the only way to photograph it.
mode = "avatar"
at = [53.2194, 6.5665, 9]
look = [-12.0, 200.0]
time = 12.0
fog = 0.08
clouds = 0.2
hide_ui = false
ui = ["chat"]

[[shot]]
name = "route"
description = "Planned route across town with the navigation panel open (ADR-037)"
# Centred east of the route's midpoint: the planner panel covers the right third
# of the frame, so the line has to sit left of centre to stay visible.
at = [53.2145, 6.5715, 1300]
look = [-50.0, 0.0]
time = 11.0
fog = 0.10
clouds = 0.15
hide_ui = false
ui = ["route"]

[[shot]]
name = "chrome"
# The interface itself, which nothing in this set documented: `route` is the only
# other preset that opens a panel, and it is framed for the *line* rather than for
# the chrome. Settings ▸ Graphics is the densest screen in the app — headings,
# body copy, switchers, checkboxes, a slider and a scrollbar in one frame — so it
# is the one that shows whether a palette change holds up. Over a city rather
# than over sky on purpose: the panels are translucent, and a screenshot of glass
# against a plain background is a screenshot of nothing.
description = "The interface: Settings over the city, the dock and the map controls"
at = [53.2194, 6.5665, 420]
look = [-22.0, 35.0]
time = 11.0
fog = 0.10
clouds = 0.25
hide_ui = false
ui = ["graphics"]

[[shot]]
name = "horizon"
description = "Tilted view from 120 km — atmosphere limb over the map tier"
at = [53.0000, 6.5665, 120000]
look = [-8.0, 0.0]
time = 15.0
fog = 0.05
clouds = 0.3

[[shot]]
name = "globe"
description = "The space tier: whole Earth from orbit, north-up"
mode = "earth"
at = [30.0000, 6.5665, 14000000]
look = [-90.0, 0.0]
time = 12.0
clouds = 0.4

# ─── Inspection views ────────────────────────────────────────────────────────
#
# The shots above are the README images, chosen because they look good. The ones
# below are chosen because they *frame a specific piece of geometry*, and they
# exist so that a viewpoint found by hand — usually after several that pointed at
# the inside of a building — is not re-found every time the same subject comes up.
# Reach for them with `--only`:
#
#     cargo shots --only quay-wall,quay-bank
#     cargo shots --only bank-slope
#
# **Look at the image before adding an entry here.** A capture from a bad camera
# position is not a null result, it is a green one that says the feature is
# missing — three of this file's first drafts were a building interior, a wall
# seen from 100° off, and open water with the subject behind the camera.
#
# The elevation layer is no longer a flag — it bakes wherever AHN covers the
# anchor — so these views always stand on measured ground. When a surface looks
# wrong, the question "is this the geometry or the terrain?" is answered by
# comparing against a place the envelope does not reach, not by a toggle.

[[shot]]
name = "quay-wall"
description = "A surveyed quay wall from over the water, face-on — does it stand at its measured height, and does the ground meet its foot?"
at = [53.222583, 6.581870, 1.6]
look = [-3.0, 0.0]
time = 12.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "quay-oblique"
description = "The same wall along its length instead of across it. Face-on gives no sense of height; receding, a wall at the wrong height reads at once"
at = [53.222537, 6.581218, 7.0]
look = [-5.0, 278.0]
time = 12.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "quay-bank"
description = "The study quay across the study pond: bank, water level and far side together. A photograph exists from this spot, so it is the view to hold against reality"
at = [53.223500, 6.581000, 1.8]
look = [-2.0, 146.0]
time = 12.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "canal-water-level"
description = "The Oosterhamrikkanaal from the quay above it — is the water below the quay, or level with the pavement?"
at = [53.222300, 6.582500, 25.0]
look = [-20.0, 48.0]
time = 12.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "bank-slope"
description = "Grass banks falling ~1.8 m over 13 m, the most ordinary relief a Dutch city has, and the view that shows whether the elevation layer is reaching the ground at all"
at = [53.223300, 6.581800, 25.0]
look = [-18.0, 135.0]
time = 12.0
clouds = 0.0
rain = 0.0

# ---------------------------------------------------------------------------
# Grouped shots: subjects, not documentation.
#
# Everything above is ungrouped and is the published set — `cargo shots`
# regenerates exactly those into `docs/img/`, and the README links every file.
# Everything below names a `group`, which does three things: `cargo shots --only
# <group>` captures just that subject, the images land in `docs/img/<group>/`
# rather than beside the published ones, and a bare `cargo shots` leaves them
# alone. `cargo shots --only all` is everything.
#
# A group is a subject worth going back and looking at while working on it — the
# mouth of a tunnel, a bridge deck, a door you can walk through. The value is the
# same as the documentation set's: a viewpoint that frames its subject was found
# by hand once, and is not re-flown and re-eyeballed by the next person.
#
# Add one with the dev panel's View tab: type the group, fly there, "📋 Copy as
# preset", paste. Every position below was captured and looked at before it was
# checked in — an unverified viewpoint is worse than none, because a run that
# photographs a car park reads as "the feature is broken".
#
# `bridges` and `doors` are the obvious next two and are deliberately absent.
# Two headless attempts at a door (2026-09-18, Folkingestraat and Oosterstraat at
# eye height, then aimed at the facade bases) came back settled, with interiors
# streaming — 50 rooms, 142 storeys — and **no door legible in the frame**: the
# ground fills the lower two-thirds and the facades show windows only. Aiming
# these by hand is the same problem the tunnels had, where eleven cameras missed
# by up to 178 m (`docs/notes/tunnels.md`).
#
# What would make it tractable: there is no metric that says *a door is in this
# frame*. `building_doors` is a count of doors drawn across every streamed cell —
# 80,579 over the city centre — so it is true everywhere and vouches for nothing.
# `interior_rooms` has the same shape. A framing metric, the way `tunnel_ahead_m`
# answers for a place rather than for the world, is the thing to add first; then
# a door shot can assert it rather than being eyeballed.
# ---------------------------------------------------------------------------

[[shot]]
name = "tunnel-approach"
group = "tunnels"
description = "Ring Zuid from 180 m outside the mouth, looking along the carriageway as it goes under. The view that shows a tunnelled road drawn over the ground it runs under: the depth error grows with distance, so a close shot of the same mouth looks right either way"
at = [53.205830, 6.577222, 25.0]
look = [-5.9, 48.0]
time = 12.0
fog = 0.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "tunnel-overhead"
group = "tunnels"
description = "Straight down onto the covered stretch: the lid filled back in over the survey's trench, the pavement beside the carriageway, and whether the two tear through each other on measured ground"
at = [53.206906, 6.579238, 80.0]
look = [-50.0, 48.0]
time = 12.0
fog = 0.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "tunnel-far"
group = "tunnels"
description = "The same mouth from 2.2 km. Deliberately distant: a per-vertex depth bias is spent as a fraction of the fragment's own depth, so a rung that is invisible up close pulls the deck metres toward the camera from here"
at = [53.193760, 6.554599, 260.0]
look = [-5.1, 48.0]
time = 12.0
fog = 0.0
clouds = 0.0
rain = 0.0

[[shot]]
name = "ring-relief"
