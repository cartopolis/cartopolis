# Eleven bridges across Groningen, each seen obliquely across its deck. The
# cameras are computed off the OSM outline (`man_made=bridge`): its long axis
# is the road, the camera stands perpendicular to it, turned 25° along it, back
# 0.8× the deck's length (60–150 m) and up 0.8× that — about 39° down, which
# clears the trees on a quay. Two are placed by hand where that camera stood
# behind a building. Every capture writes the PDOK aerial beside it, which is
# what a bridge is judged against.
#
#     cargo shots docs/bridge-shots.toml --only bridges
#     cargo shots docs/bridge-shots.toml --only bridge-herebrug

tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "1280x720"
out_dir = "gpu"
hide_ui = true
mode = "free"
time = 13.0
fog = 0.0
clouds = 0.0
rain = 0.0
settle = 3.0
wait = 180.0
aerial_reference = true

