# Water viewpoints, for looking at rather than for the README.
#
# `docs/shots.toml` is the documentation image set; this is the surface under
# test. It exists because water is almost entirely colour and lighting, and the
# containers every other lane runs in cannot judge either
# (`docs/notes/headless-shots-software-renderer.md`) — so these are the views the
# `gpu shots` workflow runs on the Steam Deck, where the answer means something.
#
#     cargo run -p cartopolis -- --shots docs/water-shots.toml
#
# Keep them cheap and comparable: one view per thing worth seeing, a fixed clock,
# and `clouds = 0` on every one of them — a cloud shadow drifting across a canal
# between two runs looks exactly like a shading change, and has already fooled one
# A/B here. Note `clouds`, `fog` and `time` are **per-shot** keys: the manifest's
# own defaults block takes only `size`, `out_dir`, `settle`, `wait`, `mode`,
# `tile_url` and `hide_ui`, and anything else there is a hard parse error.
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "1600x900"
out_dir = "gpu"
hide_ui = true
mode = "free"
settle = 1.5
wait = 45.0

[[shot]]
name = "canal"
description = "Groningen's Verbindingskanaal from just above the water — the near case: shelter, the shore band, a sky reflection at a middling angle"
at = [53.21263, 6.57016, 25]
look = [-16.0, 90.0]
time = 11.0
fog = 0.08
clouds = 0.0

# **Aim these at the sun with arithmetic, not by eye.** `--look`'s yaw is measured
# *anticlockwise* from north — a camera at yaw 0 faces north and at yaw 90 faces
# west — so a compass azimuth `a` is `yaw = 360 - a`. Getting that backwards is
# how the first version of this file pointed both "into the sun" views at empty
# sky and tested nothing, on a machine that costs twenty minutes a run. The sun's
# own azimuth and elevation come from `utils::sun::sun_direction(hours, 0.0)` at
# `OBSERVER_LATITUDE_DEG` (52°), which is what the clock here drives.

# `sunpath` and `lowsun` are deliberately the **same camera at two sun heights**
# rather than two viewpoints. The variable under test is the sun's elevation —
# `SCATTER_PEAK_ELEVATION` exists to make those two frames differ — and two
# unrelated views cannot isolate it. Yaw 99.5 is azimuth 260.5, which is where the
# sun is at 17:12; at 15:00 it sits 28° off to the left of frame, still well
# inside the glitter path.

[[shot]]
name = "sunpath"
description = "Paterswoldsemeer with the sun 25.8° up — high enough that a crest is lit over the top and opaque, so scattering should be nearly absent here"
at = [53.1720, 6.5640, 30]
look = [-4.0, 99.5]
time = 15.0
fog = 0.06
clouds = 0.0

[[shot]]
name = "lowsun"
description = "The same water and camera at 17:12, sun 7.4° up — SCATTER_PEAK_ELEVATION exactly, and the frame where crest scattering either reads as translucent water or as green paint. 18:36 was tried first and is night."
at = [53.1720, 6.5640, 30]
look = [-4.0, 99.5]
time = 17.2
fog = 0.08
clouds = 0.0

[[shot]]
name = "ringedge"
description = "12 km straight down over the Waddenzee, where streamed water meets painted tile — the seam WATER_ALBEDO is matched on"
at = [53.0700, 5.3400, 12000]
look = [-88.0, 0.0]
time = 12.0
fog = 0.05
clouds = 0.0
