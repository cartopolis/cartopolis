# The tunnels, on a machine that can draw them.
#
#     cargo shots --manifest docs/tunnel-shots.toml
#
# …or, for a real GPU, dispatch `.forgejo/workflows/gpu-shots.yml` with
# `manifest: docs/tunnel-shots.toml`. The container's lavapipe takes four seconds
# a frame over this scene, which is most of why these views were slow to iterate
# on; the Deck draws them in milliseconds.
#
# Every view is Groningen's southern ring beside the DUO tower — the stretch OSM
# flags `tunnel`, which this client drew as nothing at all until 2026-09-15
# (`docs/notes/tunnels.md`). Real-world reference: the Aanpak Ring Zuid verdiepte
# ligging, a long open trench with short lids over it.

tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "1600x900"
# `docs/gpu`, and that is not a preference: the workflow's Collect step copies
# `docs/gpu/*.png` and nothing else, so a manifest that writes anywhere else
# produces an artifact with no pictures in it.
out_dir = "gpu"
hide_ui = true
mode = "free"
# Noon and clear: this set is about geometry, not weather, and a shadow across the
# cut is the one thing that makes a seven-metre drop read as a drop.
time = 12.0
fog = 0.0
clouds = 0.0
rain = 0.0
# The ring's cells carry buildings, paving and both 3DBAG lanes; give them time.
settle = 3.0
wait = 90.0

[[shot]]
name = "portal-duo"
description = "The open cut beside DUO, looking north-east along the ring"
at = [53.20492, 6.57313, 60]
look = [-12.0, -67.0]

[[shot]]
name = "portal-duo-low"
description = "Eye level at the trench wall, where the drop is a drop"
at = [53.20510, 6.57420, 22]
look = [-6.0, -67.0]

[[shot]]
name = "portal-duo-down"
description = "Straight down over the cut: the hole, the walls, the carriageway"
at = [53.20545, 6.57520, 150]
look = [-90.0, 0.0]

[[shot]]
name = "portal-oosterpoort"
description = "The eastern portal at Oosterpoort, where the deck goes under the park"
at = [53.20548, 6.57762, 120]
look = [-35.0, -50.0]
