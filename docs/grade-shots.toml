look = [-90.0, 68.0]

[[shot]]
group = "tunnels"
name = "tunnel-julianaweg"
description = "Julianaweg, 127 m of tagged road tunnel — shorter than two 120 m ramps, so `depth_for_run` reduces its depth rather than crossing the ramps over each other and it settles at 3.2 m. Expect a dip that sags and comes back up, not a tunnel: the honest answer for an underpass, and the one case the tiles cannot tell from a tunnel under a hill."
at = [53.204313, 6.567658, 45]
look_at = [53.203614, 6.566491]

[[shot]]
group = "tunnels"
name = "tunnel-underpass-cycle"
description = "A 73 m cycle underpass north of the station, at PATH_DEPTH_M and PATH_GRADE rather than the road's seven metres and 6 %. The narrow, shallow case: giving a path the road's depth is not merely too deep, it is the difference between a dip and nothing at all, because the ramp is derived from the depth and a short run never gets there."
at = [53.211321, 6.565462, 22]
look_at = [53.211235, 6.564649]

