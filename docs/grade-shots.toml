# ─── Crossroads ─────────────────────────────────────────────────────────────
#
# Not grade separation, but the same machinery decides them: `road_stitch` cuts
# the ribbons against each other so no two cover the same ground, and
# `street_nodes` decides which arms are a junction and which merely cross. A
# junction that goes wrong looks like a flap of tarmac or a seam that flickers.
# These two are aimed by hand and were checked by eye, which is defensible for a
# junction: it has no direction to look along.

[[shot]]
group = "crossroads"
name = "crossroads-julianaplein"
description = "Julianaplein, where the ring, the Hereweg and the tunnel approaches all meet — the busiest junction in the city and the one with grade separation on three sides. Verified 2026-09-16: the ribbons cut against each other cleanly."
at = [53.2049288, 6.572469, 200]
look = [-55.0, -30.0]

[[shot]]
group = "crossroads"
name = "crossroads-europaplein"
description = "Europaplein: a large signalised junction on flat ground, so anything odd here is the ribbon cut rather than a height."
at = [53.2095754, 6.5842127, 180]
look = [-50.0, -60.0]
