# Every panel and screen at phone width, 412×900 px at 1.5 — 275 pt, the
# Android phone viewport (`ui-vocabulary.md`). Run with the scale set:
#
#     CARTO_UI_SCALE=1.5 cargo run -p cartopolis -- --shots docs/phone-ui-shots.toml
#
# and read /tmp/phone/*.png as one contact sheet (`montage`). Written to find
# the panels that ran off a phone's edge or had no close (2026-10-31).
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "412x900"
out_dir = "/tmp/phone"
hide_ui = false
mode = "free"
settle = 1.0
wait = 12.0

[[shot]]
name = "none"
at = [53.2190, 6.5680, 350.0]
look = [-50.0, 0.0]
time = 12.0
ui = []

# Your face's sheet, signed out (it replaced the ☰ menu, 2026-11-10).
[[shot]]
name = "face"
at = [53.2190, 6.5680, 350.0]
look = [-50.0, 0.0]
time = 12.0
ui = ["face"]

# The same sheet signed in, opened from the Community page's face.
[[shot]]
name = "facecommunity"
at = [53.2190, 6.5680, 350.0]
look = [-50.0, 0.0]
time = 12.0
ui = ["chats", "face"]

# Community chosen signed out: what signing in is for, the switch on Community.
[[shot]]
name = "communityout"
at = [53.2190, 6.5680, 350.0]
look = [-50.0, 0.0]
time = 12.0
ui = ["communityout"]

# Earth mode: the zoom rail on the right edge under the column of buttons.
[[shot]]
name = "earth"
at = [53.2190, 6.5680, 1500.0]
look = [-60.0, 0.0]
time = 12.0
mode = "earth"
ui = []

