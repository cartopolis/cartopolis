# Every panel and screen at phone width, 412×900 px at 1.5 — 275 pt, the
# Android phone viewport (`ui-vocabulary.md`). Run with the scale set:
#
#     CARTO_UI_SCALE=1.5 cargo run -p cartopolis -- --shots docs/phone-ui-shots.toml
#
# and read /tmp/phone/*.png as one contact sheet (`montage`). Written to find
# the panels that ran off a phone's edge or had no close (2026-10-31).
tile_url = "https://tiles.cartopolis.org/tiles/osm/{z}/{x}/{y}"
size = "412x900"
out_dir = "/tmp/phone"
hide_ui = false
mode = "free"
settle = 1.0
wait = 12.0

