name: Deploy web UI

# Build the atlas web UI (crates/atlas/web) and publish it as
# https://cartopolis.org/ — the site root. It was a separate repository's deploy, to
# web.cartopolis.org, until 2026-09.
#
# On every push to `main` that touches it, as it always was: the build is Bun
# over ~35 KB of TypeScript, it takes seconds, and publishing static files
# interrupts nobody — unlike the simulator or atlas, nothing restarts.
on:
  push:
    branches: [main]
    paths:
      - "crates/atlas/web/**"
      - ".forgejo/workflows/deploy-web.yml"
      # The chat engine the site ships as WebAssembly (`docs/notes/web-chat.md`),
      # and the protocol it speaks: a wire change the site did not follow would
      # leave its chat worker refused by the server it talks to.
      - "crates/chat/**"
      - "crates/web_chat/**"
      - "crates/e2ee/**"
      - "crates/core/**"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: build & publish the web UI
    runs-on: ubuntu-latest
    container:
      # The image carries Bun already (`tools/*.ts` are Bun scripts).
      image: cartopolis-ci:latest
      # Caddy serves this directory as cartopolis.org/. It is in the runner's
      # `valid_volumes` from when the separate repository published it.
      options: >-
        --volume /data/cartopolis/admin:/publish
        --volume /data/ci-cache/cargo-registry-web:/root/.cargo/registry
    defaults:
      run:
        working-directory: crates/atlas/web
    steps:
      - uses: actions/checkout@v4

      # `--frozen-lockfile`: a deploy must build what was reviewed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The chat engine: Rust to WebAssembly (`build-chat-core.ts`). Allowed to
      # fail for now, and the build below then ships the site without the chat
      # worker — no page uses it yet, and the step depends on the image's
      # wasm-bindgen matching Cargo.lock, which has drifted before (deploy-wasm's
      # first step checks the same thing). Make it required when a page uses it.
      - name: Build the chat engine
        id: chat
        continue-on-error: true
        run: bun run build:chat-core

      # Both gates before the build, so a red one costs seconds rather than a
      # published site nobody checked. `tsc` earns its keep: `src/types.ts`
      # describes Rust structs by hand and nothing else checks them.
      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Typecheck the chat worker
        if: steps.chat.outcome == 'success'
        run: bun x tsc --noEmit -p tsconfig.worker.json

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # `--delete`, so a file dropped from the build does not linger on the site.
      - name: Publish
        run: |
          command -v rsync >/dev/null || { apt-get update -qq && apt-get install -y -qq rsync >/dev/null; }
          rsync -a --delete dist/ /publish/
          echo "published $(du -sh /publish | cut -f1) to /data/cartopolis/admin"
