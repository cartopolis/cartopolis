name: CI

# Build and test viberfox on every push / PR.
# Runs on the self-hosted Forgejo runner (code.garage44.eu) in the prebuilt
# `viberfox-ci` image, which already carries the Rust toolchain + Bevy build
# deps (clang/lld/wayland/xkbcommon), so no per-run apt/rustup setup.
on:
  push:
  pull_request:

env:
  # CI-tuned compile: no incremental (useless on fresh runners), and
  # line-tables-only debuginfo — keeps panic backtraces but cuts LLVM codegen
  # work and shrinks target/ a lot (faster cache save/restore).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "3"

jobs:
  # Fast lane: fails within ~1 min on obvious compile errors. Runs in parallel
  # with build-test (runner capacity = 2).
  check:
    name: cargo check
    runs-on: ubuntu-latest
    container:
      image: viberfox-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/Swatinem/rust-cache@v2
      # Libs + bins across the workspace. Not --all-targets: that pulls in the
      # vendored big_space fork's test/bench targets, which reference the `bevy`
      # umbrella crate (not a dep) and don't compile — a normal build never
      # touches them, and build-test already compiles viberfox's own tests.
      - run: cargo check --workspace

  build-test:
    name: build & test viberfox
    runs-on: ubuntu-latest
    container:
      image: viberfox-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/Swatinem/rust-cache@v2
      # `cargo test` compiles the crate and runs its tests in one pass.
      - run: cargo test -p viberfox --bin viberfox
