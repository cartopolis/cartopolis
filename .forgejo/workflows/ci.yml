name: CI

# Build and test viberfox on every push / PR.
# Runs on the self-hosted Forgejo runner (code.garage44.eu), Docker executor.
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # CI-tuned compile: no incremental (useless on fresh runners), and
      # line-tables-only debuginfo — keeps panic backtraces but cuts LLVM
      # codegen work and shrinks target/ a lot (faster cache save/restore).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bevy 0.19 links with clang + lld (see .cargo/config.toml) and the
      # wayland/x11 features need the wayland + xkbcommon dev headers.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang lld pkg-config \
            libwayland-dev libxkbcommon-dev libx11-dev

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: https://github.com/Swatinem/rust-cache@v2

      # `cargo test` compiles the crate and runs its tests in one pass — a
      # separate `cargo build` would recompile viberfox a second time (test vs
      # non-test cfg) for no extra coverage, so we do just this.
      - name: Build & test viberfox
        run: cargo test -p viberfox --bin viberfox
