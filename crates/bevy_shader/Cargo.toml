# Vendored fork of bevy_shader 0.20.0 (upstream: https://github.com/bevyengine/bevy,
# MIT OR Apache-2.0), patched in through `[patch.crates-io]` in the workspace
# manifest. Every change is marked `cartopolis:`, in `src/shader_cache.rs` and
# the new `src/stored.rs`:
#
# - a release build composes WESL without WESL's own validation and source map,
#   which were half of every compose and only improve an error message;
# - a composed shader is offered to an application-installed store and looked up
#   there first, so a second run composes nothing it composed before.
#
# On the web composing runs on the page's one thread, ~2 s over a load
# (`docs/notes/wasm-performance.md`). Re-copy this from the registry on every
# bevy bump and re-apply the marked hunks. The rest of this file is cargo's
# normalised manifest from the published crate, unchanged.
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "bevy_shader"
version = "0.20.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides shader asset types and import resolution for Bevy"
homepage = "https://bevy.org"
readme = false
keywords = [
    "bevy",
    "shader",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
all-features = true

[lib]
name = "bevy_shader"
path = "src/lib.rs"

[dependencies.bevy_asset]
version = "0.20.0"

[dependencies.bevy_platform]
version = "0.20.0"

[dependencies.bevy_reflect]
version = "0.20.0"

[dependencies.bevy_utils]
version = "0.20.0"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.thiserror]
version = "2"
default-features = false

[dependencies.tracing]
version = "0.1"
features = ["std"]
default-features = false

[dependencies.wesl]
version = "0.6.0"
features = ["naga-ext"]

[dependencies.wgpu-types]
version = "30"
default-features = false

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "allow"
too_long_first_doc_paragraph = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(docsrs_dep)"]
