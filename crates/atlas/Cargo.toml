# `cartopolis_atlas` — everything around the world that is not the simulation:
# the map data pipelines (ported from an earlier TypeScript repository), the terrain tiles,
# and later registration and accounts. `docs/notes/atlas.md` has the design and
# the rules; the one that shaped this file is that it is its own process and
# never shares a runtime with the simulator's tick.
[package]
name = "cartopolis_atlas"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cartopolis_atlas"
path = "src/lib.rs"
doctest = false

# The binary is a shim over the lib, as the simulator's is; no tests of its own.
[[bin]]
name = "atlas"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
figment = { workspace = true, features = ["toml", "env"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
# All three already in the lockfile through other members; the pipelines need
# gzip for the CityJSON tiles, query encoding, and the WFS capabilities XML.
flate2 = "1.1"
earcutr.workspace = true
url = "2.5"
# Already in the lockfile through winit; streams the BGT extract's GML, which is
# hundreds of megabytes and never held whole.
quick-xml = "0.41"
serde_json.workspace = true
# The same decoder the geo crate reads PDOK with, for AHN6's tiled sheets, and
# its encoder for `/height`'s answers.
tiff.workspace = true
# JPEG decoding for the aerial photographs `roofs` samples.
image.workspace = true
cartopolis_core = { path = "../core" }
cartopolis_geo = { path = "../geo" }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
