# `cartopolis_server` — the simulator and atlas as one program to install: one
# binary, one `cartopolis.toml`, one HTTP address. Atlas still runs as a process
# of its own (this binary, started again as `cartopolis-server atlas`), never in
# the simulator's runtime (`docs/notes/atlas.md`); the simulator's listener
# passes atlas's paths on to it (`atlas_proxy`).
[package]
name = "cartopolis_server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cartopolis-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
cartopolis_core = { path = "../core" }
cartopolis_simulator = { path = "../simulator" }
cartopolis_atlas = { path = "../atlas" }
# Its own updates (`src/update.rs`): the signature (ring, already in the tree
# through rustls), the download (ureq), the package (flate2 + tar), the
# database snapshot (rusqlite) and the `[update]` table (figment).
base64 = "0.22"
figment = { workspace = true, features = ["toml"] }
flate2 = "1"
ring = "0.17"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
ureq.workspace = true

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
