[package]
name = "cartopolis_simulator"
version.workspace = true
edition.workspace = true
# The workspace declares `MIT OR Apache-2.0`; a crate only inherits it by asking.
license.workspace = true

[lib]
name = "cartopolis_simulator"
path = "src/lib.rs"

# The *binary* keeps the short name: it is what a user runs, and unlike the
# package name it never appears in a dependency graph or a `-p` flag.
[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
figment = { workspace = true, features = ["toml", "env"] }
glam.workspace = true
mlua.workspace = true
refinery = { workspace = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
cartopolis_core = { path = "../core" }

[dev-dependencies]
tempfile = "3.0"
# A WebSocket *client*, for the test that proves the browser carrier reaches the
# same handshake the TCP one does. Test-only: the server half is axum's.
tokio-tungstenite = "0.30"
# Blocking HTTP for the admin-API test. Already a workspace dependency (the
# client's tile fetch), so this costs the tree nothing new.
ureq.workspace = true

[lints]
workspace = true
