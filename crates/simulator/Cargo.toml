[package]
name = "viberfox_simulator"
version.workspace = true
edition.workspace = true

[lib]
name = "viberfox_simulator"
path = "src/lib.rs"

# The *binary* keeps the short name: it is what a user runs, and unlike the
# package name it never appears in a dependency graph or a `-p` flag.
[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
figment = { workspace = true, features = ["toml", "env"] }
glam.workspace = true
refinery = { workspace = true }
rusqlite.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
viberfox_core = { path = "../core" }

[dev-dependencies]
tempfile = "3.0"
