<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cartopolis</title>
    <!-- The WebGPU gate must come BEFORE the `rel="rust"` link below; see the
         comment in it for why the order is load-bearing rather than stylistic. -->
    <script>
      // WebGPU is a hard requirement (ADR-033): bevy's `webgpu` feature overrides
      // `webgl2`, so there is no fallback renderer left to degrade to — and we do
      // not want one, since the WebGL2 path is what cost ~10 s per frame.
      //
      // Without this gate the failure is thoroughly misleading. wgpu reports
      // `canvas.getContext() returned null; webgpu not available or canvas already
      // in use`, which reads as a canvas bug, and it arrives as a Rust panic from
      // deep inside bevy_render — after the browser has downloaded and compiled
      // ~70 MB of wasm it was never going to be able to run.
      //
      // ORDER MATTERS. Trunk replaces the `<link data-trunk rel="rust"/>` element
      // *in place* with its module loader, and emits the wasm `<link rel=preload>`
      // at the end of <head>. Both must therefore come after this script: aborting
      // the parser here means neither is ever reached, and nothing is fetched. Put
      // this after the rust link and the loader is parsed first, at which point
      // only `window.stop()`'s cancellation of already-queued work saves you —
      // which is a coincidence, not a design.
      //
      // `document.write` + `window.stop()` rather than a nicer DOM build: both are
      // synchronous, and anything deferred (DOMContentLoaded, an `await`) hands
      // control back to the parser, which is precisely what must not happen.
      //
      // Scope: this catches "the browser has no WebGPU at all", which is the case
      // actually seen in the wild (Firefox 153/Linux: `navigator.gpu` absent). It
      // cannot catch "WebGPU exists but yields no adapter" — that needs
      // `await navigator.gpu.requestAdapter()`, and awaiting anything here means
      // letting the parser run on. Those still surface as the wgpu panic.
      if (!navigator.gpu) {
        document.write(
          // Brand palette, not the browser's default greys: this page is the
          // only Cartopolis some visitors ever see. Slate graphite `#13191b` is
          // `theme::SURFACE`, `#dbe2e5` is `TEXT`, `#f3f7f9` is `CREAM`,
          // `#0a0e10` is `INK` and `#ffffff` is `ACCENT_TEXT` — the same five
          // constants the loader below and the app itself paint from. The chrome
          // is monochrome; the one colour on the page is the brand orange, and it
          // is only ever on the logo.
          '<style>' +
            'body{margin:0;background:#13191b}' +
            '.u{color:#dbe2e5;font:15px/1.6 system-ui,sans-serif;max-width:34rem;margin:12vh auto;padding:0 1.5rem}' +
            '.u h1{font-size:1.3rem;font-weight:600;color:#f3f7f9}' +
            '.u code{background:#0a0e10;padding:.1em .4em;border-radius:3px}' +
            '.u a{color:#ffffff}' +
          '</style>' +
          '<div class="u">' +
            "<h1>This browser can't run Cartopolis</h1>" +
            '<p>Cartopolis renders with <b>WebGPU</b>, which this browser does not ' +
            'expose (<code>navigator.gpu</code> is missing). Nothing has been ' +
            'downloaded.</p>' +
            '<p>Chromium-based browsers support it. Firefox does too, but not yet ' +
            'by default on every platform — check <code>about:support</code> under ' +
            '<i>Graphics</i>, and <code>dom.webgpu.enabled</code> in ' +
            '<code>about:config</code>.</p>' +
            // The one audience this page can actually help: an Android visitor
            // does not need WebGPU at all, because there is a native app. Without
            // this the gate is a dead end on the platform most likely to hit it.
            '<p>On <b>Android</b> there is a native app that needs no WebGPU: ' +
            '<a href="/apk/" style="color:#ffffff">cartopolis.org/apk</a>.</p>' +
          '</div>'
        );
        window.stop();
      }
    </script>
    <!-- Boot recorder. Must run before the loader below, and before any Rust:
         the failures worth catching on a device with no console — a module that
         will not instantiate, a memory that cannot be reserved — happen *during*
         instantiation, so nothing our `tracing` logger does will ever see them.
         `onerror` and `unhandledrejection` are the only things that will.

         It buffers rather than rendering, because at this point in the parse the
         overlay it writes into does not exist yet. -->
    <script>
      (function () {
        var lines = [];
        var seq = 0;
        window.__boot = { lines: lines, failed: false, onLine: null };
        function push(level, text) {
          if (lines.length > 400) lines.shift();
          // A monotonic id, so the renderer can append what is new instead of
          // rebuilding the buffer per line. `lines` is a sliding window and its
          // indices shift, so position cannot answer "have I drawn this one".
          lines.push({ level: level, text: text, n: ++seq });
          if (window.__boot.onLine) window.__boot.onLine();
        }
        function fmt(args) {
          return Array.prototype.map
            .call(args, function (a) {
              if (typeof a === "string") return a;
              try { return JSON.stringify(a); } catch (e) { return String(a); }
            })
            .join(" ")
            // Bevy's wasm logger writes `%c`-styled console output; strip the
            // directives and the CSS that follows them so the line stays legible.
            .replace(/%c/g, "")
            .replace(/(color|background|font-style)\s*:[^;]*;?/g, "")
            .replace(/\s+/g, " ")
            .trim();
        }
        ["log", "info", "warn", "error"].forEach(function (k) {
          var orig = console[k].bind(console);
          console[k] = function () {
            push(k, fmt(arguments));
            orig.apply(null, arguments);
          };
        });
        // A boot that follows a render halt is a *recovery*, and should say so:
        // the Rust side reloads the page after a lost graphics device (capped —
        // see `exit_on_halt` on wasm) and leaves its streak counter in
        // sessionStorage. Without this line the retry is indistinguishable from
        // a first visit, and a device that gets lost on every boot looks like a
        // loader that mysteriously runs twice.
        try {
          var reloads = sessionStorage.getItem("carto-halt-reloads");
          if (reloads) push("warn", "recovering from a lost graphics device (reload " + reloads + ")");
        } catch (e) {
          // Storage can be unavailable (privacy modes); the Rust side then
          // never reloads, so there is nothing to report either.
        }
        // Not every `error` event is the boot failing. Chrome reports a
        // ResizeObserver that took two passes to settle as one (winit observes
        // the canvas, and the stage resizes it), and a browser extension's own
        // script errors arrive here too. Marking those `failed` used to stop the
        // hand-over below for good, so the loader sat over an app that was
        // running fine underneath it. They are logged, and nothing more.
        function benign(message, file) {
          return /ResizeObserver loop/.test(message || "") ||
            /^(chrome|moz|safari(-web)?)-extension:/.test(file || "");
        }
        window.addEventListener("error", function (e) {
          var text = e.message + (e.filename ? " (" + e.filename + ")" : "");
          if (benign(e.message, e.filename)) {
            push("warn", "ignored: " + text);
            return;
          }
          window.__boot.failed = true;
          push("error", text);
        });
        window.addEventListener("unhandledrejection", function (e) {
          window.__boot.failed = true;
          push("error", "unhandled rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>
    <!-- RENDER SCALE, and the tier the whole client reads.
         ===============================================================
         Must run before the loader below: `crates/cartopolis/src/quality.rs`
         reads the `data-quality` attribute this sets during startup, and the
         canvas has to exist and be sized before winit adopts it.

         Two things are decided here, and both have to be, because neither can
         be decided from Rust.

         **The tier.** A phone is not a small desktop — see `quality.rs` for what
         the client does with the answer. The signals that identify one
         (`matchMedia`, `devicePixelRatio`, viewport size) are all page-side, and
         re-deriving them in Rust would mean two detectors that can disagree with
         each other about a machine they are both looking at.

         **The render scale**, which is the larger of the two wins and is *only*
         expressible here. On the web the render resolution is not a renderer
         setting: wgpu's surface `configure` writes `canvas.width/height` from
         the window's physical size, and that comes from winit's `ResizeObserver`
         measuring this element's device-pixel content box — CSS size ×
         `devicePixelRatio`. A Fairphone 4 reports a DPR near 2.75, so a canvas
         laid out across its 393 CSS-px viewport renders 1080×2340 real pixels,
         with HDR, an atmosphere and a tonemapper over every one of them. Bevy's
         `scale_factor_override` cannot help: winit's web `request_inner_size`
         sets the CSS size, so asking for fewer physical pixels shrinks the
         visible canvas instead of the buffer behind it.

         What does work is ordinary layout. `#stage` is sized to viewport ÷ k in
         CSS pixels — so its backing store is (viewport × DPR) ÷ k device pixels —
         and then scaled back up by k with a transform, which is not a layout
         property and so does not feed back into the observed size. The canvas
         covers the screen; the renderer pays for 1/k² of it. At the phone cap
         that is a little over a quarter of the pixels.

         `transform` and not `zoom`: zoom *is* a layout property in the browsers
         that support it, so it would change the measured box and the scale would
         cancel itself out.

         Pointer coordinates survive this. winit takes them from `offsetX/offsetY`,
         which the browser reports in the element's own untransformed coordinate
         system — the same space the backing store is in. -->
    <script>
      (function () {
        // An explicit `?quality=` wins, and is spelled the same way
        // `CARTO_QUALITY` is on the desktop (`quality.rs` parses the same
        // words, so the two halves cannot drift on vocabulary).
        //
        // The `cartopolis_` prefix is optional here because it is optional in
        // `env_value`, which accepts both spellings in either case. Matching only
        // the bare one would let `?CARTO_QUALITY=phone` put the renderer in
        // the phone tier while the page went on rendering at full resolution —
        // a half-applied budget, with nothing to say so.
        // `decodeURIComponent` throws on a malformed escape (`?quality=%`), and
        // throwing here would leave `data-quality` unset and the stage unsized
        // over a typo. An unreadable value is simply not a forced tier.
        var forced = (/[?&](?:cartopolis_)?quality=([^&]*)/i.exec(location.search) || [])[1];
        try {
          forced = forced ? decodeURIComponent(forced).trim().toLowerCase() : "";
        } catch (e) {
          forced = "";
        }

        // Three rungs now, matching `quality::Tier`. The page only needs to know
        // which of them renders at reduced resolution — that is the phone rung
        // alone — but it must still *recognise* every word, or `?quality=medium`
        // would fall through to the auto branch here while `quality.rs` parsed it
        // as a real tier, and the canvas resolution and the renderer's settings
        // would be in different tiers with nothing to say so.
        var forcedTier = null;
        if (forced === "phone" || forced === "low" || forced === "mobile") {
          forcedTier = "phone";
        } else if (forced === "balanced" || forced === "medium") {
          forcedTier = "balanced";
        } else if (forced === "desktop" || forced === "high") {
          forcedTier = "desktop";
        } else if (forced === "browser" || forced === "web") {
          forcedTier = "browser";
        }

        var phone;
        if (forcedTier) {
          phone = forcedTier === "phone";
        } else {
          // Coarse pointer *and* a small viewport. Either alone is wrong: a
          // touchscreen laptop has the first, a narrow desktop window the
          // second, and neither is a device that needs the phone budget.
          var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          var short = Math.min(window.innerWidth, window.innerHeight) < 900;
          phone = !!(coarse && short);
        }
        // `documentElement` exists as soon as `<html>` is open, so this is
        // readable from Rust however late the module instantiates. The stage
        // itself cannot be laid out yet — it is in `<body>`, which this script
        // precedes — so the second half of the job runs down there, off this
        // decision.
        // Not "desktop" when nothing was asked for: a desktop browser gets the
        // `browser` rung (`quality::Budget::browser` — balanced, shadows over
        // 400 m), which held 41 fps against desktop's 20 in Chrome on the Steam
        // Deck. `?quality=high` still asks for the full desktop rung.
        document.documentElement.dataset.quality =
          forcedTier || (phone ? "phone" : "browser");
        window.__phone = phone;
      })();
    </script>
    <!-- The autoplay unlock. Must run before the module is fetched, because it
         works by replacing a global the module will later reach for. -->
    <script>
      (function () {
        // A browser refuses to start an `AudioContext` that was neither created
        // nor resumed from a user gesture, and this app's context is neither:
        // cpal's WebAudio backend constructs it from `AudioPlugin::finish`,
        // seconds into page load with nothing clicked, and calls `resume()`
        // exactly once — a promise that is rejected there and never retried.
        // Nothing throws and nothing logs. The app simply never makes a sound,
        // for the whole session, including the Settings ▸ Audio sound test.
        //
        // There is no handle to that context on the Rust side to fix it from:
        // rodio owns the cpal stream, `bevy_audio` owns the rodio sink, and
        // neither surfaces the `AudioContext`. Hence a wrapper around the
        // constructor here — every context the module creates is remembered,
        // and resumed on the first gesture that reaches the page.
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;

        var live = [];
        var resumeAll = function () {
          for (var i = 0; i < live.length; i++) {
            if (live[i].state === "suspended") {
              // A rejection here is the ordinary case before the first gesture
              // and is not worth a console error; the listeners stay armed.
              live[i].resume().catch(function () {});
            }
          }
        };

        // A subclass rather than a wrapping function: instances stay real
        // `AudioContext`s, so wasm-bindgen's `instanceof` checks still hold.
        var Tracked = class extends Ctx {
          constructor() {
            super(...arguments);
            live.push(this);
            // If the page has already been interacted with — a click during the
            // ~70 MB download is the common case — this succeeds immediately and
            // there is no silence to unlock later.
            resumeAll();
          }
        };
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;

        // Deliberately not `once`: the first gesture often lands before the
        // context exists at all, and a context can be suspended again later (a
        // backgrounded tab), so every gesture has to be able to unlock.
        // Capture phase, because winit `preventDefault`s pointer events on the
        // canvas and a bubble-phase listener would never see the one gesture
        // that matters — the click on the map.
        ["pointerdown", "touchend", "keydown", "mousedown"].forEach(function (ev) {
          window.addEventListener(ev, resumeAll, { capture: true, passive: true });
        });
        // For diagnosing "why is it silent" from the console.
        window.__audioContexts = live;
      })();
    </script>
    <!-- Build this crate's `cartopolis` bin for wasm, Phase-1 Viewer (no sim,
         so no default `solo` feature). ADR-031/033.

         `audio` has to be named back explicitly. It is a *default* feature only
         because on Linux `bevy_audio` needs `libasound2-dev` at build time, and
         turning the defaults off to drop `solo` silently took the whole
         soundscape with it — the browser build had no footsteps, no wind and no
         driver turn cues, and `platform::audio`'s mic test reported "this build
         has no audio support". The browser needs none of ALSA: `bevy_audio`
         enables `rodio/wasm-bindgen` on wasm and cpal's backend is WebAudio.

         Keep this in step with `.forgejo/workflows/ci.yml`'s wasm check, which
         passes the same two flags on the command line. -->
    <script>
      // Download progress for the HTML loader while the module downloads and
      // compiles. This is deliberately *not* a splash: the splash is Bevy's, and
      // it cannot exist until the engine is running — which is the several
      // seconds this covers. So the job here is narrow: say honestly how far
      // along the load is, and say clearly when it has failed.
      //
      // **Why this wraps `instantiateStreaming` rather than being a Trunk
      // `data-initializer`** (which it was until 2026-10-08): Trunk's initializer
      // counts bytes by re-wrapping the body in `new Response(stream)`, and a
      // synthetic Response has no URL. Chrome keys its compiled-wasm code cache on
      // the response's URL, so that wrapper meant the ~88 MB module was compiled
      // from scratch on every visit, cached download or not. Here the browser
      // compiles the *real* response, and the progress is read off a clone.
      //
      // Only the first streaming call is the page's module: wasm_thread's
      // workers instantiate the already-compiled `WebAssembly.Module`.
      (function () {
        var orig = WebAssembly.instantiateStreaming;
        if (!orig) return;
        var el = function (id) { return document.getElementById(id); };
        // `force` is what keeps a diagnosis on screen. The sanity checks below
        // run concurrently with the transfer, so a fatal one (no GPU adapter)
        // lands mid-download and the very next progress tick would paint
        // "Downloading engine… 41.2 MB" back over it. Once the boot has failed,
        // only the failure path may write here.
        var set = function (state, text, force) {
          // Any sign of life, failed or not, is what the watchdog below times
          // its "stalled" verdict from.
          window.__boot.progressAt = Date.now();
          window.__boot.phase = state;
          if (window.__boot.failed && !force) return;
          var s = el("status");
          if (s) s.textContent = text;
          var root = el("loader");
          if (root) {
            root.dataset.state = state;
            delete root.dataset.stalled;
          }
        };
        var mb = function (n) { return (n / 1e6).toFixed(1); };
        var progress = function (current) {
          var bar = el("bar");
          if (!bar) return;
          // Bytes counted are *decoded* bytes, and a compressed transfer carries
          // no usable Content-Length for them: show motion and the count, not a
          // fake percentage.
          bar.classList.add("indeterminate");
          set("loading", "Downloading engine… " + mb(current) + " MB");
        };
        var compiling = function () {
          var bar = el("bar");
          if (bar) {
            bar.style.width = "100%";
            bar.classList.add("indeterminate");
          }
          // For a module this size compiling is seconds more, with no progress
          // signal available.
          set("compiling", "Starting engine…");
        };
        var count = function (response) {
          if (!response.body) return;
          var reader = response.body.getReader();
          var current = 0;
          var pump = function () {
            reader.read().then(function (r) {
              if (r.done) { compiling(); return; }
              current += r.value.byteLength;
              progress(current);
              pump();
            }, function () {});
          };
          pump();
        };
        var used = false;
        WebAssembly.instantiateStreaming = function (source, imports) {
          if (used) return orig.call(WebAssembly, source, imports);
          used = true;
          set("loading", "Downloading engine…");
          var real = Promise.resolve(source).then(function (r) {
            try { count(r.clone()); } catch (e) {}
            return r;
          });
          return orig.call(WebAssembly, real, imports).then(function (v) {
            // Do NOT hide the loader here. This fires when the module has
            // instantiated, not when anything has been drawn — hiding now would
            // show a blank canvas until Bevy's own splash appears. The script
            // below hides it on the first real frame instead.
            set("running", "Ready");
            return v;
          }, function (error) {
            // wasm-bindgen retries with `instantiate` when the MIME type is
            // wrong, so this is reported but the boot is not yet over; a real
            // failure surfaces through the boot recorder's handlers.
            console.error("wasm streaming instantiation failed:", error);
            throw error;
          });
        };
        // The other way in. wasm-bindgen falls back to downloading the bytes
        // and calling `instantiate` when the server sends the module with the
        // wrong MIME type (or the streaming call failed); none of the wrapper
        // above runs then, and the status line used to sit on "Downloading
        // engine…" through the whole compile. A `Module` argument is a worker
        // instantiating what was already compiled, and is not the page's load.
        var origInstantiate = WebAssembly.instantiate;
        var fellBack = false;
        WebAssembly.instantiate = function (source, imports) {
          var result = origInstantiate.apply(WebAssembly, arguments);
          if (!fellBack && !(source instanceof WebAssembly.Module)) {
            fellBack = true;
            compiling();
            result.then(function () { set("running", "Ready"); }, function () {});
          }
          return result;
        };
      })();
    </script>
    <link data-trunk rel="rust" data-bin="cartopolis" data-cargo-no-default-features
          data-cargo-features="audio" />
    <!-- Bevy fetches assets over HTTP relative to the page; the client's asset
         root is `assets` on wasm (see main.rs). Trunk copies the tree there. -->
    <link data-trunk rel="copy-dir" href="../../assets" data-target-path="assets" />
    <!-- Calls: the encoded-transform worker and its SFrame, loaded as a module
         worker by `web/webcall.js` (which wasm-bindgen bundles itself, as a
         snippet). docs/notes/calls.md. -->
    <link data-trunk rel="copy-dir" href="web" data-target-path="web" />
    <!-- The loader's backdrop: the web UI's street plan, the same file. -->
    <link data-trunk rel="copy-file" href="../atlas/web/src/img/groningen.svg" />
    <!-- Android App Links. The phone fetches /.well-known/assetlinks.json at
         install time and will only open `https://cartopolis.org/go?place=…` in the
         app if it names that package *and* the certificate the APK is signed with
         (docs/notes/place-links.md).

         It rides in the trunk dist rather than being placed on the host by hand
         for one reason: deploy-wasm.yml publishes with `rsync --delete`, so
         anything under the web root that trunk did not produce is removed on the
         next deploy. A file the site needs and the build does not know about is a
         file that works until the next push. -->
    <link data-trunk rel="copy-file" href="assetlinks.json" data-target-path=".well-known" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* Brand graphite, not black: this is what shows for the frames before
           the loader paints, and a black flash reads as a broken page. Matches
           `systems::theme::SURFACE`. */
        background: #13191b;
        /* Pull-to-refresh and rubber-banding are chrome-level gestures: they are
           decided before any pointer event is dispatched, so `preventDefault`
           in the canvas handler cannot reach them. A downward drag on the map
           would otherwise reload the page. */
        overscroll-behavior: none;
      }
      /* The render-scale carrier. Sized in px and scaled by the script in
         <body>; `transform-origin: 0 0` so scaling grows it toward the bottom
         right and it still starts at the top-left of the viewport.

         `position: fixed` rather than in flow: a transformed element keeps its
         *untransformed* box for layout, so an in-flow stage would reserve a
         viewport-sized hole and leave the scaled-up canvas overlapping whatever
         followed it. */
      #stage {
        position: fixed;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* The touch bridge (`systems::touch`) needs every finger, and the
           browser's default gesture layer claims most of them first: a
           one-finger drag scrolls, two fingers pinch-zoom the *page*, and a
           double tap zooms. `touch-action: none` hands the lot to us — without
           it the map is inert under exactly the gestures it exists for, and no
           `TouchInput` ever reaches Rust to explain why. Not redundant with
           winit's own `preventDefault`: this is consulted by the compositor
           before the event is dispatched at all. */
        touch-action: none;
        /* A long press is our context menu (`systems::touch`); left to itself
           the browser answers it with a text-selection callout over the map. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Same brand tones as the <head> abort page above — an "it doesn't work
         here" screen is still the product's screen. */
      .unsupported {
        color: #dbe2e5;
        background: #13191b;
        font: 15px/1.6 system-ui, sans-serif;
        max-width: 34rem;
        margin: 12vh auto;
        padding: 0 1.5rem;
      }
      .unsupported h1 { font-size: 1.3rem; font-weight: 600; color: #f3f7f9; }
      .unsupported code {
        background: #0a0e10;
        padding: 0.1em 0.4em;
        border-radius: 3px;
      }
      .unsupported a { color: #ffffff; }

      /* The wordmark face, the same file `systems::theme` embeds for the Bevy
         splash — without it the handover swaps typeface mid-load, which is the
         one difference the eye catches every time. `swap` so a slow font never
         holds the wordmark back: the fallback stack is close enough for the
         moment it is up. */
      @font-face {
        font-family: "Cartopolis Brand";
        src: url("assets/fonts/PlusJakartaSans-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }

      /* Loader, not a splash — and yet it has to *be* the splash.
         ===============================================================
         The engine cannot draw until ~70 MB has been fetched and compiled, so
         on the web this covers the first several seconds of the product. It
         used to spend them on a monospace checklist of GPU/asset/worker probes
         over a scrolling boot log: a build harness, shown to every visitor,
         while `systems::splash` — whose module note says the two are drawn to
         match — waited behind it with the logo and the wordmark. So the brand
         is here now and the instrumentation is behind `?log` (and the failure
         state, where it is exactly what you want). Keep the palette, the type
         sizes and the motto in step with `systems::theme` and
         `systems::splash`; they are one screen handed over mid-load. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        /* The loader, the Bevy splash and the app chrome all paint from
           `systems::theme`'s palette — keep these in step with it. */
        background: #13191b;
        color: #a5b2b7;
        font: 13px/1.5 system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease;
        padding: 6vh 1.5rem;
        box-sizing: border-box;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      /* The street plan behind cartopolis.org's glass, and behind
         `systems::splash`'s logo: Groningen's centre in one faint ink
         (`theme::TEXT_DIM` at 9 %, the web theme's `--c-map`). The file is the
         web UI's own, copied in by Trunk below. Sized to the large viewport
         rather than the loader's box, so a phone's address bar sliding away
         does not rescale it under the logo. */
      #loader::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100lvh;
        z-index: -1;
        pointer-events: none;
        background: rgb(170 194 198 / 9%);
        -webkit-mask: url("groningen.svg") center / cover no-repeat;
        mask: url("groningen.svg") center / cover no-repeat;
      }
      #loader { isolation: isolate; }
      #retry {
        display: none;
        font: inherit;
        color: #f3f7f9;
        background: #1f2829;
        border: 1px solid #2a3536;
        border-radius: 999px;
        padding: 0.45rem 1.4rem;
        cursor: pointer;
      }
      #retry:hover { background: #263842; }
      #loader[data-stalled] #retry,
      #loader[data-state="failed"] #retry { display: inline-block; }
      /* Brand block: logo, wordmark, motto — the Bevy splash's layout, in CSS.
         `#brand` owns its own gap so the checklist appearing under `?log` cannot
         push the wordmark off centre. */
      #brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        margin-bottom: 0.6rem;
        /* The entrance half of `systems::splash`'s pair of fades, at its
           `FADE_IN_S`. On `#brand` and not on `#loader`, for the same reason the
           Rust side keeps its backdrop opaque: the slate must be there on the
           first painted frame, or the page opens on a flash of whatever is
           behind it. `both` holds the from-state before the animation starts, so
           there is no unstyled first frame at full opacity. */
        animation: brand-in 0.45s ease both;
      }
      @keyframes brand-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* An entrance is decoration; someone who has asked for less motion has said
         they do not want it. The fade-out stays — it is how the loader gets out
         of the way — but it is a plain opacity change, not movement. */
      @media (prefers-reduced-motion: reduce) {
        #brand { animation: none; }
      }
      #logo {
        /* 168 px is the Bevy splash's own mark size (an 84 pt radius). The `vh`
           term is what keeps a landscape phone from pushing the wordmark and the
           progress track off the bottom of a 360 px-tall viewport. */
        width: min(40vw, 30vh, 168px);
        height: auto;
        aspect-ratio: 1;
      }
      #wordmark {
        font-family: "Cartopolis Brand", system-ui, -apple-system, sans-serif;
        font-weight: 600;
        /* `theme::SPLASH_WORDMARK` / `SPLASH_MOTTO`, in px — egui points and CSS
           pixels are the same unit at the scale factor both sides are laid out
           against. */
        font-size: 40px;
        line-height: 1.1;
        color: #f3f7f9;
      }
      /* Cream `carto`, accent `polis` — `theme::WORDMARK_HEAD` here, and the
         atlas web UI's `.app-header .wordmark b` in `crates/atlas/web`. Three
         surfaces, one way of writing the name.

         `#fd6012` is `theme::WORDMARK_TAIL_COLOR` (= `theme::BRAND`), and the
         same orange as the mark's ring and `#bar` below. This said `#ff9457`
         while the Rust side said `#ffa470` — two lightened accents, neither of
         them the one they sit next to, which is how the name came to read pink
         on a screen whose every other orange is this one.

         It is `BRAND` rather than `ACCENT` since the chrome went monochrome:
         the app's live tone is a grey now, and the logo kept its colour. This
         page is the loudest place that distinction shows — the wordmark, the
         mark and the progress bar are the only orange left on any screen. */
      #wordmark b {
        color: #fd6012;
        font-weight: 600;
      }
      #motto {
        font-size: 16px;
        color: #a5b2b7;
      }
      #track {
        width: min(22rem, 70vw);
        height: 3px;
        background: #1d2427;
        border-radius: 2px;
        overflow: hidden;
      }
      #bar {
        width: 0%;
        height: 100%;
        background: #fd6012;
        border-radius: 2px;
        transition: width 0.2s linear;
      }
      /* Used when the transfer reports no total: motion without a false number. */
      #bar.indeterminate {
        width: 35% !important;
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { margin-left: -35%; }
        100% { margin-left: 100%; }
      }
      #loader[data-state="failed"] #bar { background: #f2a296; animation: none; }
      #loader[data-state="failed"] #status { color: #f2a296; }
      /* The instrumentation. Hidden by default — it is a developer console, and
         it was the first thing every visitor saw for the whole download. It
         comes back for the two audiences that want it: `?log`, and any run that
         has actually failed (`data-state="failed"`, set by the fatal-check
         branch and by the boot recorder's `onerror`), where this list *is* the
         diagnosis on a phone with no console. The probes still run and still
         fill in either way; only the display is gated, so nothing has to be
         re-run when a failure reveals it. */
      #checks, #bootlog { display: none; }
      #loader[data-log] #checks,
      #loader[data-state="failed"] #checks { display: flex; }
      #loader[data-log] #bootlog,
      #loader[data-state="failed"] #bootlog { display: block; }
      #checks {
        list-style: none;
        margin: 0;
        padding: 0;
        width: min(30rem, 90vw);
        flex-direction: column;
        gap: 0.2rem;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #checks li { display: flex; gap: 0.6rem; align-items: baseline; }
      /* Fixed-width mark so the labels line up while rows are still settling. */
      #checks .mark { flex: none; width: 1ch; text-align: center; color: #7b878c; }
      #checks .label { flex: none; }
      #checks .note { color: #7b878c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* No green in the brand palette (systems::theme has no success colour), so
         "passed" is just ordinary text — the eye is meant to catch the failures. */
      #checks li[data-ok="yes"] .mark { color: #dbe2e5; }
      #checks li[data-ok="warn"] .mark,
      #checks li[data-ok="warn"] .note { color: #d8c07a; }
      #checks li[data-ok="no"] .mark,
      #checks li[data-ok="no"] .note,
      #checks li[data-ok="no"] .label { color: #f2a296; }
      #bootlog {
        width: min(64rem, 100%);
        /* Scrollable, and tall enough to hold a paragraph. It was a fixed 9rem
           with `overflow: hidden`, which is fine on a desktop and useless on the
           phone this panel exists for: one `tracing` line wraps to five or six
           visual rows there, so the box showed a single log line and offered no
           way to reach the ones above it. That is exactly the wrong shape for
           the thing it is — the app keeps logging after a failure (storage,
           coverage manifests), so the ERROR worth reading is pushed out of a
           one-line window within a second of arriving, and the only reason the
           2026-08-23 device loss was ever read off a phone is that it was
           text-selected and dragged out by hand. */
        height: min(22rem, 40vh);
        overflow-y: auto;
        /* Don't hand the scroll to the page once this reaches its end — the
           loader fills the viewport, so the chain would just rubber-band. */
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: #69757a transparent;
        margin: 0;
        padding: 0.6rem 0.8rem;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid #69757a;
        border-radius: 8px;
        color: #7b878c;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      /* Two hints, one slot: install the app, or open the place you followed a
         link to in the app you already have. Only ever one of them is shown. */
      #android-hint,
      #android-open {
        margin: 14px 0 0;
        text-align: center;
        font: 14px/1.4 "Plus Jakarta Sans", system-ui, sans-serif;
      }
      #android-hint a,
      #android-open a { color: #ffffff; text-decoration: none; }
      #android-hint a:hover,
      #android-open a:hover { text-decoration: underline; }
      #bootlog .warn { color: #d8c07a; }
      #bootlog .error { color: #f2a296; }
    </style>
  </head>
  <body>
    <!-- The canvas is placed here rather than left to winit (`Window::canvas`
         adopts it by this id) so it can sit inside `#stage`, which is what the
         render scale acts on. See the RENDER SCALE comment in <head>.

         `width="1"` is deliberate: the loader hands over on the first canvas
         wider than 1 px, and an unsized canvas defaults to 300×150 — which would
         satisfy that test before Bevy had drawn a single frame. -->
    <div id="stage"><canvas id="cartopolis-canvas" width="1" height="1"></canvas></div>
    <script>
      (function () {
        var phone = window.__phone;
        // Device pixels per CSS pixel we are willing to render. 1.5 keeps text
        // and the map's line work from going visibly soft while cutting a 2.75×
        // screen to ~30% of its pixels; 1 would be cheaper and looks it. The
        // desktop tier is uncapped — a workstation GPU is not what runs out here.
        var MAX_DPR = phone ? 1.5 : Infinity;
        // …and an absolute ceiling, for the large high-DPI screen that satisfies
        // the DPR cap and is still far too many pixels for a mobile GPU.
        var MAX_PIXELS = phone ? 1300000 : Infinity;

        var stage = document.getElementById("stage");

        function layout() {
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var dpr = window.devicePixelRatio || 1;
          // Both caps expressed as a divisor, then the stricter one wins. k > 1
          // shrinks the buffer; k == 1 leaves the page exactly as it was before
          // any of this existed, transform included.
          var k = Math.max(1, dpr / MAX_DPR, Math.sqrt((vw * vh * dpr * dpr) / MAX_PIXELS));
          stage.style.width = vw / k + "px";
          stage.style.height = vh / k + "px";
          stage.style.transform = k === 1 ? "none" : "scale(" + k + ")";
          window.__renderScale = {
            k: k,
            dpr: dpr,
            width: Math.round((vw * dpr) / k),
            height: Math.round((vh * dpr) / k),
          };
        }

        layout();
        // `resize` covers rotation and the mobile browser's collapsing chrome.
        // DPR can also change without one — a window dragged between monitors of
        // different densities — which is what the media query catches.
        window.addEventListener("resize", layout);
        var dpr = window.devicePixelRatio || 1;
        var watch = window.matchMedia("(resolution: " + dpr + "dppx)");
        if (watch.addEventListener) watch.addEventListener("change", layout);
      })();
    </script>

        <div id="wordmark">carto<b>polis</b></div>
        <div id="motto">Explore our world</div>
      </div>
      <div id="track"><div id="bar"></div></div>
      <div id="status">Downloading engine…</div>
      <!-- Shown when the load has stalled or failed (the watchdog below). A
           stuck loader with nothing to press is a dead end on a phone. -->
      <button id="retry" type="button" onclick="location.reload()">Reload</button>
      <ul id="checks"></ul>
      <pre id="bootlog"></pre>
      <!-- Shown only on Android. The wasm client is a ~70 MB download that a
           phone browser will run slowly at best; the APK is the better answer and
           was, until now, discoverable only from a note in docs/. -->
      <p id="android-hint" hidden>
        <a href="/apk/">On an Android phone? Install the app instead →</a>
      </p>
      <!-- The same slot, but for a phone that arrived by following a link to a
           place: the app can show that place natively, and the 70 MB module about
           to download cannot do it better. Filled in by the script below. -->
      <p id="android-open" hidden>
        <a id="android-open-link" href="#">Open this place in the Cartopolis app →</a>
      </p>
    </div>
    <script>
      // Reveal the APK link on Android only. A userAgent test is the right tool
      // here despite its reputation: the question is literally "is this device
      // running the OS the APK targets", which no feature test can answer.
      if (/Android/i.test(navigator.userAgent)) {
        // A place in the URL changes which hint is the useful one. Reaching this
        // page *with* one means either the app is not installed, or Android did
        // not verify the App Link (a sideloaded build, or link handling turned off
        // for the app) — and a page cannot tell those apart: there is no way to
        // ask "is that app installed?", by design. So this offers the custom
        // scheme and lets the tap answer the question. It is a button and never an
        // automatic redirect: a navigation to an unhandled scheme is an error page
        // on some browsers and a silent nothing on others, and either would be
        // inflicted on someone who is perfectly happy in the browser.
        var params = new URLSearchParams(location.search);
        var place = params.get("place") || params.get("PLACE");
        if (place) {
          var open = document.getElementById("android-open");
          document.getElementById("android-open-link").href =
            "cartopolis://go?place=" + encodeURIComponent(place);
          open.hidden = false;
        } else {
          document.getElementById("android-hint").hidden = false;
        }
      }
      // `?log` (or `?LOG`) keeps the loader up after the first frame — the flag
      // the hand-over below already reads. It reveals the checklist and the boot
      // log too, and it has to be set here rather than there because the CSS
      // needs it before the first paint, not after the engine has drawn.
      if (/(^|[?&])(log|LOG)(=|&|$)/.test(location.search)) {
        document.getElementById("loader").dataset.log = "";
      }
    </script>
    <script>
      // Sanity checks, run in parallel with the download.
      //
      // The `navigator.gpu` gate in <head> is a *pre-download* abort, and its own
      // comment explains why it can only ever answer "is there a WebGPU API at
      // all": awaiting anything there hands control back to the parser, which is
      // the one thing it must not do. These run after the parse, so they can await
      // — which is what the questions that actually matter require. Is there an
      // adapter behind the API? Did the asset tree ship next to the page? Will the
      // tile decode get real cores? On a phone with no console, this list is the
      // whole diagnosis.
      //
      // A failure here is reported, not acted on: `window.stop()` would abort the
      // in-flight module fetch and save the transfer, but trunk's own `onFailure`
      // would then overwrite the explanation with the resulting fetch abort — a
      // worse message for a better bandwidth bill.
      (function () {
        var CHECKS = [
          {
            label: "GPU adapter",
            // The only fatal one. `navigator.gpu` present with nothing behind it
            // is exactly the case the <head> gate cannot catch, and wgpu reports
            // it as `canvas.getContext() returned null` from deep inside
            // bevy_render — a canvas-shaped lie, arriving after 70 MB.
            fatal: true,
            run: async function () {
              if (!navigator.gpu) return { ok: "no", note: "navigator.gpu missing" };
              var adapter = await navigator.gpu.requestAdapter();
              if (!adapter) return { ok: "no", note: "WebGPU present, no compatible adapter" };
              // `adapter.info` is the current spec; `requestAdapterInfo()` is the
              // older async spelling still shipping in some browsers. Either may
              // report empty strings — the fields are privacy-gated, not missing.
              var info = adapter.info ||
                (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
              var desc = info && [info.vendor, info.architecture].filter(Boolean).join(" ");
              return { ok: "yes", note: desc || "available" };
            },
          },
          {
            label: "Asset tree",
            // Trunk copies `assets/` next to the page (`rel="copy-dir"`) and Bevy
            // loads from that root. When the copy is missing the first symptom is
            // a shader that never compiles, seconds later and nowhere near the
            // cause. A text asset, deliberately: the binaries here are LFS-tracked
            // and a pointer file would still answer 200.
            run: async function () {
              var r = await fetch("assets/shaders/water.wesl", { cache: "no-store" });
              if (!r.ok) return { ok: "no", note: "assets/ → HTTP " + r.status };
              var head = (await r.text()).slice(0, 200);
              if (head.indexOf("git-lfs") !== -1) {
                return { ok: "no", note: "LFS pointer, not the asset — `git lfs pull`" };
              }
              return { ok: "yes", note: "reachable" };
            },
          },
          {
            label: "Worker threads",
            // Not fatal — the single-threaded build is a supported target. But
            // without shared memory `platform::workers` puts every tile decode on
            // the main thread, between animation frames, and the map fills in at a
            // crawl rather than not at all. That is worth naming before someone
            // reports it as a performance bug.
            run: async function () {
              if (typeof SharedArrayBuffer === "undefined" || !self.crossOriginIsolated) {
                return { ok: "warn", note: "single-threaded — no cross-origin isolation (COOP/COEP)" };
              }
              return { ok: "yes", note: (navigator.hardwareConcurrency || "?") + " cores" };
            },
          },
          {
            label: "Render budget",
            // Not a check — a report. On a phone with no console this is the
            // only place the two decisions made before any Rust ran are
            // visible, and both are worth seeing when a device turns out slow:
            // whether it was recognised as a phone at all, and how many pixels
            // it ended up committing to. `?quality=high` forces the full budget
            // if this got it wrong.
            run: async function () {
              var tier = document.documentElement.dataset.quality || "?";
              var s = window.__renderScale;
              if (!s) return { ok: "warn", note: tier + ", render scale not applied" };
              var note = tier + " · " + s.width + "×" + s.height;
              if (s.k > 1) note += " (1/" + s.k.toFixed(2) + " of " + s.dpr + "× DPR)";
              return { ok: "yes", note: note };
            },
          },
          {
            label: "Heap reservation",
            // The boot failures on small devices are memory, not code: the module
            // reserves a large 32-bit heap during instantiation, before any Rust
            // logger exists, so a device that cannot back it fails silently. 256
            // MiB is well under what the engine asks for, which makes a failure
            // here conclusive and a pass merely encouraging — hence the wording.
            run: async function () {
              try {
                var m = new WebAssembly.Memory({ initial: 4096 }); // 4096 × 64 KiB
                m = null;
                return { ok: "yes", note: "256 MiB probe reserved" };
              } catch (e) {
                return { ok: "warn", note: "could not reserve 256 MiB — the engine needs more" };
              }
            },
          },
        ];

        var list = document.getElementById("checks");
        CHECKS.forEach(function (check) {
          var li = document.createElement("li");
          li.dataset.ok = "pending";
          ["mark", "label", "note"].forEach(function (cls) {
            var span = document.createElement("span");
            span.className = cls;
            li.appendChild(span);
          });
          li.querySelector(".mark").textContent = "·";
          li.querySelector(".label").textContent = check.label;
          li.querySelector(".note").textContent = "checking…";
          list.appendChild(li);

          // Each check settles on its own; a slow adapter query must not hold up
          // the asset fetch, and neither may reject into the boot recorder's
          // `unhandledrejection` hook and fail the whole boot on its own.
          Promise.resolve()
            .then(check.run)
            .catch(function (e) {
              return { ok: check.fatal ? "no" : "warn", note: String((e && e.message) || e) };
            })
            .then(function (r) {
              li.dataset.ok = r.ok;
              li.querySelector(".mark").textContent =
                { yes: "✓", warn: "!", no: "✕" }[r.ok] || "·";
              li.querySelector(".note").textContent = r.note;
              if (r.ok === "no" && check.fatal) {
                window.__boot.failed = true;
                // Fatal: the hand-over stops waiting for a canvas that cannot come.
                window.__boot.fatal = true;
                var s = document.getElementById("status");
                if (s) s.textContent = "Can't run here — " + check.label + ": " + r.note;
                document.getElementById("loader").dataset.state = "failed";
              }
            });
        });
      })();
    </script>
    <script>
      (function () {
        var loader = document.getElementById("loader");
        var log = document.getElementById("bootlog");

        var drawn = 0;
        function render() {
          var b = window.__boot;
          // Whether the reader is parked at the bottom, asked *before* anything
          // is appended. Scrolling back to read a failure has to survive the
          // lines that keep arriving after it, so only a reader already at the
          // end gets followed down.
          var stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
          for (var i = 0; i < b.lines.length; i++) {
            var l = b.lines[i];
            if (l.n <= drawn) continue;
            var span = document.createElement("span");
            span.className = l.level;
            span.textContent = l.text + "\n";
            log.appendChild(span);
            drawn = l.n;
          }
          // Match the recorder's own window, or a long session grows a DOM node
          // per line forever.
          while (log.childNodes.length > 400) log.removeChild(log.firstChild);
          if (stick) log.scrollTop = log.scrollHeight;
          if (b.failed) loader.dataset.state = "failed";
        }
        window.__boot.onLine = render;
        render();

        // Hand over on the first drawn frame, not on `onSuccess`: the module
        // instantiating is not the same as anything being on screen, and hiding
        // early would show a blank canvas before Bevy's splash appears.
        // One detector for the flag: the block under the loader markup set
        // `data-log` before the first paint (the CSS needed it then), so read
        // that back rather than parsing the query string a second time.
        var keep = loader.dataset.log !== undefined;
        // **A drawing engine beats an error line.** This used to stop waiting the
        // moment anything set `failed`, and an `error` event during boot is not
        // proof of a dead engine (see the recorder's `benign`), so a loader could
        // sit forever over a running app. Now only a *fatal* check (no GPU
        // adapter) ends the wait; any other failure keeps the diagnosis on screen
        // until either a frame is drawn — and then the app is what is shown — or
        // nothing ever is, and the diagnosis stays with a Reload under it.
        var handed = false;
        function handOver() {
          if (handed || keep) return;
          handed = true;
          loader.classList.add("done");
          setTimeout(function () { loader.remove(); }, 500);
        }
        (function wait() {
          if (window.__boot.fatal || handed) return;
          var c = document.querySelector("#stage canvas") || document.querySelector("canvas");
          if (c && c.width > 1 && c.height > 1) {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                if (window.__boot.fatal) return;
                handOver();
              });
            });
            return;
          }
          requestAnimationFrame(wait);
        })();

        // The watchdog. A loader that never says anything new is
        // indistinguishable from a hung one, so after a while without progress
        // it says so and offers a Reload — not a failure: a slow network or a
        // slow compile still finishes on its own, and the next progress tick
        // clears the note. Timed off `__boot.progressAt`, which every status
        // change writes. Wall clock, on purpose: `requestAnimationFrame` stops in
        // a background tab, and coming back to a tab should show the truth at
        // once.
        var STALL_MS = { loading: 20000, compiling: 45000, running: 25000 };
        var started = Date.now();
        setInterval(function () {
          if (handed || !loader.isConnected) return;
          var b = window.__boot;
          var phase = b.phase || "loading";
          var since = Date.now() - (b.progressAt || started);
          if (since < (STALL_MS[phase] || 20000)) return;
          if (loader.dataset.stalled === phase) return;
          loader.dataset.stalled = phase;
          if (b.failed) return; // The failure line is already the better message.
          var s = document.getElementById("status");
          if (s) {
            s.textContent = {
              loading: "The download has stalled. Check the connection, or reload.",
              compiling: "Starting the engine is taking longer than usual…",
              running: "The engine started but has not drawn anything yet…",
            }[phase] || "This is taking longer than usual…";
          }
        }, 1000);
      })();
    </script>
