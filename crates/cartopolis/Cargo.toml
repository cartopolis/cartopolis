[package]
name = "cartopolis"
version.workspace = true
edition.workspace = true
# The workspace declares `MIT OR Apache-2.0`; a crate only inherits it by asking.
license.workspace = true

# macOS `.app` Dock icon: `cargo bundle` builds an `.icns` from these PNGs
# (macOS has no per-window icon, so `set_window_icon` can't apply it at runtime).
[package.metadata.bundle]
name = "Cartopolis"
identifier = "eu.garage44.cartopolis"
icon = ["assets/icon/cartopolis.png"]

# A lib target plus a shim bin, rather than bin-only. `cargo test` links the
# rlib; bin-only forced it to recompile the whole crate under `cfg(test)` as a
# second artifact. See docs/notes/client-build-cost.md.
[lib]
name = "cartopolis"
path = "src/lib.rs"
# A lib target makes `cargo test` collect doc-tests, and rustdoc does NOT receive
# `.cargo/config.toml`'s `rustflags` — those only reach rustc; rustdoc needs
# `rustdocflags`. So every doc-test built without `target-cpu=x86-64-v3` and
# tripped `simd_baseline`'s AVX2 `compile_error!`. Nothing here is a library API
# whose examples need executing, so collect none rather than duplicate the flag.
doctest = false

[[bin]]
name = "cartopolis"
path = "src/main.rs"
# The shim has no tests and never will — everything real is in the lib, which is
# the whole point of the split described in `main.rs`. Left on, `cargo test`
# builds and links a *second* harness for it anyway (`Running unittests
# src/main.rs ... 0 passed`), and that link is the crate's full dependency graph:
# a ~120 MB binary produced on every run of the suite to execute nothing.
test = false

[features]
# There is no `solo` feature any more (removed 2026-08-21): the in-process
# simulator was a third run mode nobody needed — dev is `cargo run -p
# cartopolis_simulator` plus a sign-in to 127.0.0.1:4747, the same online path
# every server uses. The simulator crate survives here as a dev-dependency, so
# the loopback tests still boot the real thing.
default = ["audio"]
# `audio`: the avatar soundscape (`systems::soundscape` — footsteps, landings,
# wind). On by default, because a city you can walk through in silence reads as a
# viewer rather than as a place.
#
# It is a *feature* rather than an always-on dependency for one reason: on Linux
# `bevy_audio` pulls `alsa-sys`, whose build script needs the ALSA **development
# headers** (`libasound2-dev`) and hard-fails at build time without them. That is
# a new system prerequisite for every Linux build of this client, including
# headless ones that will never open a device — the agent container and CI among
# them. Those build with `--no-default-features --features solo`.
#
# That reason is **Linux-desktop-only**, and being a *default* feature made it
# look like a platform capability instead. Android and the web both build
# `--no-default-features` (to drop `solo`, which needs a bundled SQLite neither
# can cross-compile), and for months that silently took the soundscape with it —
# a phone and a browser with no footsteps, no wind and no driver turn cues,
# reported by nothing. Neither platform needs ALSA at all: cpal resolves to
# AAudio on Android and to WebAudio on wasm. So both build lanes now name this
# feature back explicitly, and any *new* lane that turns the defaults off must
# too:
#   crates/cartopolis_android/Cargo.toml   features = ["audio"]
#   crates/cartopolis/index.html           data-cargo-features="audio"
#   .forgejo/workflows/ci.yml              --features audio (the wasm check)
#
# The footsteps and the city's background loops are CC0 recordings under
# `assets/sounds/` (Git LFS, loaded at run time, so a missing object is a
# synthesised step, not a build failure); the landing, wind and chimes are
# synthesised at startup. `bevy/vorbis` decodes the recordings: lewton, pure Rust,
# so it cross-compiles to Android and wasm like the rest.
#
# `dep:cpal` is the *capture* half. `bevy_audio` wraps rodio, which is output-only,
# so the microphone needs cpal directly — but cpal is already in the graph *under*
# rodio, so this adds a direct edge rather than a new crate. It rides the same
# feature because it links the same ALSA on Linux: a headless build that opts out
# of `bevy_audio` must not be given an alsa-sys dependency by the back door.
audio = ["bevy/bevy_audio", "bevy/wav", "bevy/vorbis", "dep:cpal"]
# Faster incremental linking when hacking gameplay; not for release binaries.
fast-dev = ["bevy/dynamic_linking"]
# The performance suite's deep instruments (`systems::perf`, `cargo perf`).
#
# Three things, none of which a shipped build should carry:
#
# * `bevy/trace` puts a tracing span around every system run. **`bevy/debug` is not
#   optional beside it**: without it `DebugName::type_name` returns the literal
#   `<Enable the debug feature to see the name>` and every span carries that as its
#   name, so a per-system table collapses into one row. Measured before the feature
#   was added, so this is a fixed bug and not a caution; upstream's own
#   `trace_chrome` pulls `debug` in for the same reason.
# * The counting allocator from `cartopolis_geo::perf`, installed as this binary's
#   `#[global_allocator]`. Allocation traffic is the one performance number that is
#   exact and machine-independent, and there is no way to get it without a branch
#   on every allocation in the process.
# * Bevy's own diagnostic plugins, which add per-frame work to the render app.
# * `systems::dev::system_timings`, which counts those spans per system and is
#   read per perf window. **Not `bevy/trace_chrome`**, which looks like the
#   obvious way to get this and cannot work here: that feature installs its layer
#   inside Bevy's `LogPlugin`, and `run` disables `LogPlugin` on desktop in favour
#   of this tree's own subscriber, so asking for it builds, runs and produces no
#   trace file with nothing said — one full client rebuild to discover. A chrome
#   layer on *our* subscriber was then built and also thrown away: 2.5 GB for one
#   scenario, a second program needed to read it, and a whole-run total cannot
#   separate a streaming cost from a frame cost (2026-09-22).
#
# The suite runs *without* this feature and reports its other columns; the ones it
# cannot measure come back absent rather than zero, which is the difference between
# "not instrumented" and "costs nothing".
perf = [
    "bevy/trace",
    "bevy/debug",
    "bevy/sysinfo_plugin",
    "cartopolis_geo/perf",
]
# Opt out of the SIMD baseline `src/simd_baseline.rs` asserts. For bisecting a
# codegen bug, or a host that really does predate AVX2 — not for shipped builds,
# where it silently costs several times the tile raster throughput.
scalar-fallback = []

[dependencies]
anyhow.workspace = true
bevy.workspace = true
bevy_image.workspace = true
big_space.workspace = true
clap.workspace = true
earcutr.workspace = true
fontdue.workspace = true
image.workspace = true
tiff.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dotenvy.workspace = true
serde_json.workspace = true
# Parse the optional `--login` credentials file (ADR-016).
toml = "0.8"
cartopolis_core = { path = "../core" }
cartopolis_geo = { path = "../geo" }
# MakeHuman bodies built at runtime (`systems::human_avatar`).
cartopolis_human = { path = "../human" }
# Visual-inertial odometry for the high-precision mode (`systems::high_precision`).
cartopolis_vio = { path = "../vio" }
# The custom render materials and the plugin that registers them, kept below
# this crate so Bevy's per-material plugin code is not generated here
# (docs/notes/client-build-cost.md).
cartopolis_materials = { path = "../materials" }
# Private chats (`systems::private_chat`). The only crate that can open a
# sealed message; the simulator links it for tests only.
cartopolis_e2ee = { path = "../e2ee" }
# The private-chat engine (`systems::private_chat` re-exports it).
cartopolis_chat = { path = "../chat" }
# Calls in private chats (`systems::calls`, `docs/notes/calls.md`): the
# `client` half only — sealing, Opus and a device's session. The forwarder is
# the simulator's. Pure Rust on every target this crate builds for.
cartopolis_calls = { path = "../calls", features = ["client"] }
# The private-chat state blob (`systems::private_chat`); already built for core.
postcard = { workspace = true }
bytes.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
# The contact link drawn as a QR code (`systems::contacts`). Pure Rust with no
# dependencies of its own, so it builds on every lane, Android and wasm included.
qrcodegen = "1.8"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }
# The client-intent channel behind `OnlineSession` — pure-Rust and wasm-safe,
# unlike tokio's `sync::mpsc`, so the online session type compiles on the web
# build (the transport itself, `network.rs`, stays native). ADR-033.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
# `poll_once`/`block_on` for draining `IoTaskPool` fetch tasks without blocking the
# schedule (platform::http). Already in the tree via Bevy's async_executor.
futures-lite = "2"
# Portable `Instant`/`SystemTime` (ADR-033): plain `std` on native, JS-backed on
# wasm where `std::time::Instant::now()` panics. Already in the tree via Bevy.
web-time = "1"
# Satellite orbits from published element sets (`systems::satellites`). Pure
# Rust, so it builds for Android and the web unchanged.
sgp4 = { version = "2.4", default-features = false, features = ["std"] }
tzf-rs = "1.3.6"
jiff = "0.2.34"
# Direct handle on winit purely to build a `window::Icon` for the runtime OS
# window icon (Bevy 0.19's `Window` has no icon field). Version-matched to
# bevy_winit so Cargo unifies to the one compiled winit — `default-features =
# false` adds nothing bevy hasn't already enabled. See `systems::window_icon`.
winit = { version = "0.30", default-features = false }
# GRIB2 decode for live GFS global cloud cover (ADR-032). Default features off:
# `jpeg` pulls openjpeg-sys (a cmake-built C lib that does not build for wasm32,
# ADR-033) and `png` pulls the png crate — both only decode DRS templates 5.40/5.41,
# which the field we request does not use. NOMADS packs GFS `TCDC:entire atmosphere`
# with DRS template **5.3** (complex packing + spatial differencing), which gribberish
# decodes unconditionally. Everything left is pure Rust. If a future field 404s with a
# template error, check the DRS template before adding the feature back.
gribberish = { version = "1.5", default-features = false }

# Wayland windowing is Linux-only. Kept off the shared bevy feature list (see the
# workspace Cargo.toml) so macOS/Windows builds never pull the wayland stack; winit
# uses the native AppKit/Win32 backend there. Cargo unions these features with the
# main `bevy.workspace = true` entry above, so on Linux the feature set is unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["wayland"] }

# Web build (ADR-033): the browser `fetch` backend for `platform::http`. wasm-only
# so native builds never see it — native HTTP is `ureq`. This *can* be compiled in
# the dev image since 2026-08-10, but not with a bare `cargo check --target`:
# see docs/notes/checking-the-web-build.md for the four flags it needs and why
# each one's error names something other than its cause.
# Native-only deps whose crates don't build for wasm (or are meaningless there).
# Their call sites are cfg-gated to the matching target (ADR-030/033).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# An external GNSS receiver — an RTK rover on a cable — as the first location
# provider (`platform::gnss_receiver`). The desktop also takes its serial port,
# below; Android reaches the adapter through the USB host API instead.
cartopolis_gnss = { path = "../gnss" }
# Microphone capture for `platform::audio` (see the `audio` feature above).
# Version-matched to the cpal rodio already resolves, so Cargo unifies to one
# copy rather than compiling two ALSA backends.
#
# **Under plain `not(wasm32)`, and Android is the reason.** It sat with arboard
# under `not(wasm32) && not(android)` while the phone had no capture arm — and
# the day that arm was enabled, the crate stopped compiling for
# aarch64-linux-android with four `unresolved module cpal` errors and nothing
# anywhere else. Android needs cpal *more* than the desktop does, not less: its
# host is AAudio, which is the NDK's own C API and pulls no ALSA, no GTK and no
# C++ (the reasons the neighbours below are desktop-only). `cargo check
# --workspace` cannot see this — `cartopolis_android` is empty off Android — so
# it is the target check that says so.
cpal = { version = "0.17", optional = true }
# The sim transport (network.rs) + solo sim are tokio/TCP — native only. The web
# build is Phase-1 Viewer with no sim (ADR-031/033); `OnlineSession`'s channel is
# futures-channel, so nothing wasm-side needs tokio.
tokio.workspace = true
tokio-util.workspace = true
ureq.workspace = true
# TLS to a remote simulator. The desktop and Android clients speak the same
# `wss://` the browser does, so a password never crosses a network in the clear on
# any build (`network::Target`).
#
# **rustls, deliberately not native-tls.** native-tls means OpenSSL on Linux and
# Android, and cross-compiling OpenSSL for `aarch64-linux-android` is its own
# afternoon — the CI target lane runs `cargo check` with nothing but the NDK's
# clang, and a vendored OpenSSL build script would break it. rustls is pure Rust
# and needs neither.
#
# `webpki-roots` (a compiled-in copy of Mozilla's trust store) rather than
# `rustls-native-certs`: Android has no `/etc/ssl/certs` to read, and reaching the
# system store there is a JNI call through `KeyStore` that this tree has no seam
# for. The cost is that a corporate MITM root or a private CA is not trusted, and
# the fix for that is an explicit `ws://` address, which is why that escape hatch
# exists.
tokio-tungstenite.workspace = true
# Named directly only to pin the crypto provider, and it has to be pinned.
#
# rustls 0.23 has no built-in default: it resolves a process-wide `CryptoProvider`
# from its own features, and if that is ambiguous — zero providers enabled, or
# both — it **panics at the first connection** with "Could not automatically
# determine the process-level CryptoProvider". `tokio-tungstenite`'s
# `rustls-tls-webpki-roots` does not select one, so this compiles perfectly and
# then dies the first time anyone signs in. Nothing but running it finds that;
# it was caught here by connecting to the real deployment, not by CI.
#
# `ring` and not `aws-lc-rs`: aws-lc-rs needs cmake and a C toolchain, and the CI
# target lane checks `aarch64-linux-android` with nothing but the NDK's clang.
# `network::install_crypto_provider` installs it explicitly anyway, so a future
# dependency that switches this on cannot silently make it ambiguous again.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The desktop clipboard. Deliberately *not* under `cfg(not(wasm32))` with the rest:
# Android is a native target too, and arboard is X11/Wayland/AppKit/Win32 only — it
# has no android backend and does not build for one. Android's clipboard is a JNI
# call through `ClipboardManager`, which is its own seam and not wired yet
# (`utils::clipboard` has a no-op arm for it).
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
# The receiver's serial port (`cartopolis_gnss::serial`): a tty here, and no
# such thing on a phone — see the entry under `not(wasm32)`.
cartopolis_gnss = { path = "../gnss", features = ["serial"] }
arboard.workspace = true
# The file dialog behind `platform::photo` on the desktop — the arm that answers
# "attach a photo to this place" where there is no camera to point at one.
#
# Sits with arboard rather than under plain `not(wasm32)` for the same reason: it
# is a *desktop* dialog. Android has no xdg portal and no GTK, and its photo arm
# is a camera intent instead.
#
# `default-features = false` is load-bearing. rfd's default backend on Linux is
# GTK3, which needs `libgtk-3-dev` at build time — a new system prerequisite for
# every Linux build of this client, including the agent container and CI, neither
# of which has it (the same trap `bevy_audio`/alsa-sys documents above). The
# `xdg-portal` backend talks to `org.freedesktop.portal.FileChooser` over DBus
# instead: pure Rust, no headers, and it is what a sandboxed desktop wants anyway.
# macOS and Windows are unaffected — their backends are cfg-selected, not
# feature-selected.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# The Model Context Protocol server this client hosts (`systems::mcp`,
# `--mcp-listen`), so an IDE can drive it: move the camera, photograph what it
# sees, read the scene's metrics.
#
# **Unix desktops only.** A phone has no IDE pointed at it and a browser tab
# cannot listen on a socket at all, so neither target gains anything from a
# server — while both would pay for a second JSON-RPC stack in a binary whose
# size is a shipping constraint. Windows is out because the listener is a Unix
# domain socket and the socket's directory is the whole of the access control
# (`docs/notes/driving-the-client-from-an-ide.md`); a named-pipe arm is what it
# would take. `build.rs` sets the `mcp` cfg on exactly this predicate, so the
# code and the dependency cannot disagree about which targets have it.
#
# Not a cargo feature: Android and the web build `--no-default-features`, so a
# default feature would be dropped there by accident rather than by decision —
# the trap `audio` documents at the top of this file.
#
# The listener, the tool surface and the SDK are in their own Bevy-free crate,
# `crates/mcp_server`, so that heavy async generic code is compiled outside
# this crate; the two talk only through its job channel.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
cartopolis_mcp = { path = "../mcp_server" }
# The voice agent (`systems::mcp::voice`): a call answered by OpenAI's
# Realtime model, with the MCP tools as its functions. Bevy-free, like the
# server, and for the same reason.
cartopolis_voice = { path = "../voice" }
# MCP carries an image as base64 in a JSON message, so a capture has to be
# encoded before it can be handed over. Already in the lock under the simulator.
base64 = "0.22"

# Android (`docs/notes/android-build.md`). `android-native-activity` picks the
# `android-activity` backend, and without one of the two that crate is a bare
# `compile_error!` — it owns the `android_main` entrypoint, so exactly one backend
# must be linked, and nothing in Bevy's default set picks one for us (this
# workspace builds bevy with `default-features = false`).
#
# NativeActivity rather than GameActivity because it needs **no Java at all**:
# `android.app.NativeActivity` is in the framework, so the APK is a manifest plus
# a `.so` plus assets, with no AAR to resolve, no `classes.dex` to build and no
# Gradle. GameActivity is the direction Google points, but its Java class ships in
# an AAR with transitive androidx dependencies, and resolving those without Gradle
# is most of what a Gradle project is for. The price is the soft keyboard — see
# the note.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }
# JNI, for `platform::android`: the device location provider, `open_url` and the
# soft-input probe are all calls into the Android *framework*, which is the only
# way to reach any of them in an APK with no `classes.dex`.
#
# Pinned to the version `android-activity` 0.6 already resolves (`jni 0.21.1` in
# Cargo.lock, via its `cesu8`/`jni-sys` line), so this is a new *edge* in the graph
# and not a new subtree — nothing extra is compiled for the phone build, and the
# CI Android check gains no download. If a Bevy bump moves android-activity onto a
# different jni major, unify this with it rather than letting two copies link:
# `JavaVM`/`JObject` from two `jni` versions are distinct types, and the error that
# produces names a trait bound rather than a duplicate crate.
jni = "0.21.1"
# The NDK's C sensor API, for the compass (`platform::orientation`). It is here
# rather than behind `jni` for a reason that is not a preference:
# `SensorEventListener` is a Java *interface*, so the JNI route needs a class we
# would have to define — the exact thing `android:hasCode="false"` forbids.
# `ASensorManager` needs no `classes.dex` at all.
#
# A new *edge*, not a new subtree: `ndk-sys` is already in `Cargo.lock` under
# `android-activity` (and so under bevy's Android backend), so naming it here
# compiles nothing extra. `ndk` 0.9's safe wrappers do not cover sensors, which is
# why this is the `-sys` crate.
# `media` for `AImageReader`, which is how the call camera (`platform::camera`)
# reads Camera2's pictures; it links `libmediandk`, a system library.
ndk-sys = { version = "0.6", features = ["media"] }
# AAudio through its safe wrapper, for one thing cpal cannot ask for: a
# microphone opened with the `VOICE_COMMUNICATION` input preset, which is where
# an Android device's echo cancellation lives (`platform::audio::call_capture`,
# used by calls). Already in the graph under `android-activity`; this adds the
# `audio` module to it and nothing else.
# `api-level-28` for the input preset, which AAudio gained in API 28 — the
# APK's `minSdkVersion`, so every device it installs on has it.
ndk = { version = "0.9", features = ["audio", "api-level-28"] }
# `__system_property_get` (`platform::android::system_property`) and
# `setpriority` (the tile-worker nice in `run`). Both are bare libc, not
# framework calls, so neither needs a `classes.dex` — which is the only reason
# they are reachable at all.
#
# A new *edge*, not a new subtree: libc 0.2.178 is already in `Cargo.lock` under
# half the graph, so the phone build compiles nothing extra for this.
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.5"
# Web render backend (ADR-033). WebGPU, not WebGL2, and the difference is not
# cosmetic: WebGL2 has no compute pipeline, no storage buffers and no storage
# textures *as an API*, so on it Bevy drops the atmosphere, SSAO, OIT and
# environment-map generation outright and falls back to CPU light clustering and
# CPU batching preprocessing. Running those unoptimised over a few hundred draws
# measured ~10 s per frame — the fallbacks, not the shaders, were the cost. WebGPU
# exposes all of it, so the GPU paths light up and the workarounds below come out.
#
# The two are mutually exclusive: bevy's `webgpu` feature *overrides* `webgl2`, so
# this build requires a browser that exposes WebGPU, and there is no automatic
# WebGL2 fallback left to inherit. Chromium-based browsers have it; **Firefox on
# Linux does not necessarily**, and its failure mode is worth recognising —
# `canvas.getContext()` returns null and wgpu reports "webgpu not available or
# canvas already in use", which reads like a canvas bug rather than a missing
# feature. Observed on Firefox 153 here with no `dom.webgpu.enabled` user pref;
# check `about:support` under Graphics before suspecting the build.
#
# `web` is not optional and not cosmetic: `bevy_platform::time::Instant` resolves to
# `web_time` only under `cfg(all(target_arch = "wasm32", feature = "web"))` and
# otherwise falls through to `use std::time`, whose `Instant::now()` is the
# `unsupported` stub that panics "time not implemented on this platform". Bevy calls
# it constantly (frame timing, asset channels), so without this the browser build
# carries a landmine under every clock read — it surfaced as tiles dying mid-decode
# with a stack that pointed at the raster code rather than at the clock. Our own
# code was already on the `web-time` shim; this puts Bevy's on it too.
bevy = { workspace = true, features = ["webgpu", "web"] }
# There is deliberately no `getrandom` entry here any more.
#
# It read `getrandom = { version = "0.2", features = ["js"] }`, to give uuid's v4
# generator a JS backend on wasm where there is no OS RNG. That stopped being true
# without anyone noticing: uuid 1.24 moved to getrandom 0.4 and then excludes it
# on `wasm32-unknown-unknown` outright, so nothing in the wasm graph depended on
# 0.2 except this line. `cargo tree --target wasm32-unknown-unknown -i
# getrandom@0.2.16` named `cartopolis` as the sole reverse dep, and 0.3/0.4 were
# absent from that graph entirely — i.e. it was compiling a crate nothing linked.
#
# The trap it leaves behind: `Uuid::new_v4()` on wasm now needs uuid's own `js`
# feature, which the workspace does not enable. Harmless today because the client
# only names the type and never generates one — but adding the first `new_v4()`
# call to client code is what will surface it, not this file.
# Read the page's query string, which is where `env_flag` gets its switches on a
# platform with no environment (ADR-033). Already in the graph via bevy/wgpu, so
# naming it here costs no build time — only these three features.
# `Navigator`/`Geolocation*`/`PositionOptions` are the device-location seam
# (`platform::location`), which driver mode uses on the web; `Clipboard` is the
# copy half of `utils::clipboard` (the paste half can't use it — see that
# module); `Document`/`Element` read the render tier index.html resolved onto
# `<html data-quality>` before the module was fetched (`crate::quality`); the
# rest read the page's query string.
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Location",
    # The render-halt recovery (`lib.rs::exit_on_halt` on wasm): the reload-streak
    # counter lives in `sessionStorage`, and `performance.now()` is the uptime
    # that tells a fresh device loss from a streak of them.
    "Storage",
    "Performance",
    "UrlSearchParams",
    "Navigator",
    "Clipboard",
    "Geolocation",
    "GeolocationPosition",
    "GeolocationCoordinates",
    "GeolocationPositionError",
    "PositionOptions",
    # The compass (`platform::orientation`): `deviceorientationabsolute`, and
    # `deviceorientation` for Safari. Only `alpha`/`absolute` are typed here —
    # `webkitCompassHeading` and `screen.orientation.angle` are read through
    # `Reflect`, being non-standard and legacy-shaped respectively.
    "DeviceOrientationEvent",
    # Microphone capture (`platform::audio`): `getUserMedia` through
    # `MediaDevices`, then a WebAudio graph — a `MediaStreamAudioSourceNode` into
    # a `ScriptProcessorNode` whose `AudioProcessingEvent` carries the PCM.
    "MediaDevices",
    "MediaStream",
    # Stopping each track is what clears the browser's recording indicator;
    # closing the AudioContext alone does not.
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "AudioContext",
    "AudioContextOptions",
    "AudioNode",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioProcessingEvent",
    "ScriptProcessorNode",
    # A place's photo (`platform::photo`): a hidden `<input type="file"
    # accept="image/*" capture="environment">`, which a phone browser answers with
    # the camera and a desktop one with an ordinary file picker. `HtmlElement` and
    # `CssStyleDeclaration` are only there to hide the element, `FileReader` reads
    # the picked `File` into bytes, and `EventTarget` is what `set_onchange` is
    # declared on.
    "HtmlInputElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    # IndexedDB — the web half of `platform::storage`, i.e. every byte this client
    # keeps: the tile/building/POI cache, `user.json` and the photos on saved
    # places. `DomStringList` is what `IDBDatabase.objectStoreNames` answers with,
    # and the upgrade path reads it to decide which stores to create.
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "DomStringList",
    # `navigator.storage.persist()`: without it a browser may evict the Data
    # namespace under pressure, and Safari drops it after seven idle days — which
    # would read as the user's saved places vanishing on their own.
    "StorageManager",
    # The sim transport (`systems::ws_transport`). `BinaryType` is not optional
    # decoration: without setting it to `arraybuffer` a binary frame arrives as a
    # `Blob`, and reading one is asynchronous — every frame of a 20 Hz snapshot
    # stream would take a round trip through a promise.
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "Event",
    # The pointer's timed trail (`platform::pointer_trail`): each event's position and
    # `timeStamp`, so a drag can be replayed at an even pace.
    "MouseEvent",
    "AddEventListenerOptions",
] }
# `Object`/`Reflect` build the `getUserMedia` audio constraints, and read `name`
# off a rejected permission promise. Already in the graph under web-sys; named
# here only to make the import legal.
js-sys = "0.3"
# Await the `writeText` promise so a rejected clipboard write is logged rather
# than left as an unhandled rejection (`utils::clipboard`). Already in the graph
# under bevy — naming it here only makes the import legal.
wasm-bindgen-futures = "0.4"
# `Closure`, to hand `watchPosition` a Rust callback it can keep calling
# (`platform::location`). Already in the graph under web-sys; named here for the
# import.
wasm-bindgen = "0.2"
# jiff (timezone/local-time) needs its `js` backend on wasm — `Timestamp::now()`
# otherwise panics ("current time not possible with just std"). ADR-033.
jiff = { version = "0.2.34", features = ["js"] }
# Real threads for the CPU half of tile decoding (ADR-033, `platform::workers`).
# `std::thread::spawn` is Unsupported on wasm32 even with atomics — creating a
# thread is a JS act — so this starts Web Workers that re-instantiate the module
# against the shared imported memory. `es_modules` matches trunk's
# `wasm-bindgen --target web` output.
wasm_thread = { version = "0.3", features = ["es_modules"] }

# Embeds the app icon (assets/icon/cartopolis.ico) into the Windows .exe via
# `build.rs`. NOT host-gated: cross-compiling to Windows from the Linux CI needs
# winresource on the Linux host so build.rs (which gates on the *target* OS) can
# invoke it. For any non-Windows target build.rs never calls it. See `build.rs`.
[build-dependencies]
winresource = "0.1"

[lints]
workspace = true


# The webcam, for video calls (`platform::camera`): V4L2 on Linux, Media
# Foundation on Windows, AVFoundation on macOS. Desktop only — the phone's
# camera is the NDK's, and the browser's is the browser's. No default features:
# those decode MJPEG through mozjpeg, a C library, and the camera is asked for
# uncompressed YUYV instead. Its Linux bindings are made by bindgen at build
# time, which needs libclang (present on the workstation and in the CI image).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

# The screen a call shares (`platform::screen`), one way per desktop, each a
# crate already in the build through winit: X11's own protocol in pure Rust,
# Core Graphics on macOS, GDI on Windows. Android's is MediaProjection, in Java.
[target.'cfg(target_os = "linux")'.dependencies.x11rb]
version = "0.13"

[target.'cfg(target_os = "macos")'.dependencies.core-graphics]
version = "0.23"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
# The loopback tests (`systems::voice::loopback`, the session restart test)
# boot a real simulator; test-only, so it ships in no client build.
cartopolis_simulator = { path = "../simulator" }
# A throwaway world database for those same tests. Already in the tree as the
# simulator's own dev-dependency.
tempfile = "3"
