# Realistic people built at runtime from MakeHuman's CC0 data: a body shaped by
# the macro sliders, clothes fitted to it, a skeleton placed in it, and
# motion capture (100STYLE, CMU) retargeted onto that skeleton
# (docs/notes/makehuman-avatars.md).
#
# Bevy-free for the reason cartopolis_geo is: the shaping, fitting and
# retargeting are arithmetic over arrays, tested here without the client's link.
# The client turns a `HumanModel` into entities.
[package]
name = "cartopolis_human"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cartopolis_human"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "human-pack"
path = "src/bin/human-pack.rs"
required-features = ["pack"]
test = false

[features]
# Reading the MakeHuman and motion-capture sources to write a pack. Only the pack tool
# needs it; the client reads the pack and nothing else.
pack = ["dep:serde_json", "dep:image"]

[dependencies]
glam.workspace = true
serde.workspace = true
postcard.workspace = true
# The pack is deflated (`HumanPack::encode`). miniz_oxide underneath, pure Rust,
# so it builds for the phone and the web as it does here.
flate2 = "1.1"
serde_json = { workspace = true, optional = true }
# Resizing the textures and making the neutral, tintable ones (`pack::textures`).
image = { workspace = true, optional = true }

[lints]
workspace = true
