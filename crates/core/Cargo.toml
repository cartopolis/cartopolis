[package]
name = "cartopolis_core"
# Was pinned at 0.1.0 while the rest of the workspace moved. Nothing depends on
# it by version — all three consumers are bare `path` dependencies — so the pin
# bought nothing and only made `cargo metadata` disagree with the release it is
# part of.
version.workspace = true
edition.workspace = true
# The workspace declares `MIT OR Apache-2.0`; a crate only inherits it by asking.
license.workspace = true

[lib]
# No runnable doc fence in the crate, so the rustdoc pass `cargo test` makes to
# look for one finds nothing every time. The other three owned crates already
# collect none; see `cartopolis_simulator`'s manifest for the same note, and turn
# this back on in the same commit as the first example worth executing.
doctest = false

[dependencies]
glam = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
# `point`: a point is an ActivityStreams object, i.e. JSON (see that module).
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Note the workspace entry turns `approx`'s default features off; see the
# comment there, it is load-bearing for the build and not a size trim.
approx = { workspace = true }

[lints]
workspace = true
