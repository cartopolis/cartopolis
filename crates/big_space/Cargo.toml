# Vendored fork of big_space 0.10.0 (upstream: https://github.com/aevyrie/big_space,
# MIT OR Apache-2.0). Copied verbatim so we can port it to newer Bevy in place —
# upstream tops out at Bevy 0.18 and has no 0.19 release. Examples, benches, and
# dev-dependencies from upstream are dropped; only the library is kept.
[package]
name = "big_space"
version = "0.10.0"
edition = "2021"
description = "A floating origin plugin for bevy (vendored fork)"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "floating-origin", "large-scale", "space"]
repository = "https://github.com/aevyrie/big_space"

[features]
default = ["std"]
debug = ["std", "bevy_gizmos", "bevy_color"]
camera = ["std", "bevy_render", "bevy_time", "bevy_input"]
i8 = []
i16 = []
i32 = []
i64 = []
i128 = []

std = [
    "bevy_app/std",
    "bevy_ecs/std",
    "bevy_math/std",
    "bevy_reflect/std",
    "bevy_transform/std",
    "bevy_utils/std",
    "bevy_platform/std",
    "bevy_color?/std",
    "bevy_input?/std",
    "bevy_time?/std",
]
libm = ["bevy_math/libm", "dep:libm"]

[dependencies]
smallvec = { version = "1.13.2", default-features = false } # Already used by bevy in commands
bevy_app = { version = "0.19.0", default-features = false, features = [
    "bevy_reflect",
] }
bevy_ecs = { version = "0.19.0", default-features = false }
bevy_log = { version = "0.19.0", default-features = false }
bevy_math = { version = "0.19.0", default-features = false }
bevy_reflect = { version = "0.19.0", default-features = false, features = [
    "glam",
] }
bevy_tasks = { version = "0.19.0", default-features = false }
bevy_transform = { version = "0.19.0", default-features = false, features = [
    "bevy-support",
    "bevy_reflect",
] }
bevy_utils = { version = "0.19.0", default-features = false }
bevy_platform = { version = "0.19.0", default-features = false, features = [
    "alloc",
] }
# Optional
bevy_color = { version = "0.19.0", default-features = false, optional = true }
bevy_gizmos = { version = "0.19.0", default-features = false, optional = true }
bevy_render = { version = "0.19.0", default-features = false, optional = true }
bevy_input = { version = "0.19.0", default-features = false, optional = true }
bevy_time = { version = "0.19.0", default-features = false, optional = true }
libm = { version = "0.2", default-features = false, optional = true }

# The vendor drop removed upstream's dev-dependencies along with its examples and
# benches, which silently took the crate's own test suite with it — every
# `mod tests` in here reaches for `bevy::prelude`, so `cargo test -p big_space`
# stopped compiling entirely. The umbrella crate is already built for the
# workspace, so depending on it here costs no extra build.
[dev-dependencies]
# Deliberately not `workspace = true`: that profile carries `bevy_winit`, whose
# platform backend is selected per-target in cartopolis's own manifest, so it will
# not build from here. The tests need the ECS, an `App` to run it in, and
# `Visibility` — nothing that opens a window.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_render",
    "async_executor",
    "std",
] }

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
